<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מבחני תרגול — טכנאי רשת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --surface2:#E3EAF3; --ink:#0B1729; --muted:#4A5C75; --line:#C9D4E2;
  --cyan:#0E7490; --cyan-soft:#D3EEF4; --amber:#A75A06; --amber-soft:#FBEACB;
  --ok:#0E7490; --bad:#B42318; --bad-soft:#F8DCD9;
  --panel:#0B1729; --panel-2:#13243F; --panel-ink:#DCE7F5; --panel-muted:#7F93B0;
  --led-off:#24395A; --led-ok:#22D3EE; --led-part:#FBBF24; --led-bad:#F87171;
  --focus:#0E7490;
  --serif:"Frank Ruhl Libre", "David Libre", Georgia, serif;
  --sans:"Heebo", "Segoe UI", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1729; --surface:#11213A; --surface2:#182C4A; --ink:#E6EEF8; --muted:#97A9C3; --line:#24406A;
    --cyan:#22D3EE; --cyan-soft:#0D3345; --amber:#FBBF24; --amber-soft:#3A2D0E;
    --ok:#22D3EE; --bad:#F87171; --bad-soft:#3D1A20;
    --panel:#07101F; --panel-2:#0F1E36; --panel-ink:#DCE7F5; --panel-muted:#7F93B0; --led-off:#1E3150;
    --focus:#22D3EE; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1729; --surface:#11213A; --surface2:#182C4A; --ink:#E6EEF8; --muted:#97A9C3; --line:#24406A;
  --cyan:#22D3EE; --cyan-soft:#0D3345; --amber:#FBBF24; --amber-soft:#3A2D0E;
  --ok:#22D3EE; --bad:#F87171; --bad-soft:#3D1A20;
  --panel:#07101F; --panel-2:#0F1E36; --panel-ink:#DCE7F5; --panel-muted:#7F93B0; --led-off:#1E3150;
  --focus:#22D3EE; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 72px}
h1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0}
p{margin:0 0 .6em}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.mono{font-family:var(--mono)}
.cli{font-family:var(--mono);direction:ltr;unicode-bidi:plaintext;white-space:pre-wrap;text-align:left}
pre.cli{margin:0;font-size:.875rem;line-height:1.5;background:var(--surface2);border-radius:6px;padding:10px 12px;overflow-x:auto}

/* top bar */
.top{display:flex;align-items:center;gap:4px 12px;justify-content:space-between;flex-wrap:wrap;padding:10px 16px;max-width:760px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:8px 10px;min-width:0;flex-wrap:wrap}
.brand h1{font-size:1.25rem;font-weight:900}
@media (max-width:520px){.brand h1{font-size:1.1rem}}
.ver{font-family:var(--mono);font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px;white-space:nowrap}
.ai-chip{font-size:.8rem;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--led-off);display:inline-block}
.dot.on{background:var(--led-ok);box-shadow:0 0 6px var(--led-ok)}
.dot.wait{background:var(--led-part)}
.notice{max-width:760px;margin:0 auto 4px;padding:0 16px}
.notice div{border:1px solid var(--amber);background:var(--amber-soft);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:.875rem}
.notice strong{font-weight:700}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:500;min-height:44px}
.btn:hover{border-color:var(--cyan)}
.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#fff}
:root:not([data-theme="light"]) .btn.primary{color:#04121F}
@media (prefers-color-scheme: light){ .btn.primary{color:#fff} }
:root[data-theme="light"] .btn.primary{color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.link{background:none;border:0;padding:0;color:var(--cyan);text-decoration:underline;text-underline-offset:3px;font-weight:500}

/* segmented */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 14px;min-height:40px;font-size:.95rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:500}
.field{display:grid;gap:6px;margin-bottom:14px}
.field>span{font-size:.9rem;color:var(--muted)}
.field>.seg{justify-self:start;max-width:100%}

/* panel hero */
.panel{background:var(--panel);color:var(--panel-ink);border-radius:10px;padding:16px 16px 12px;margin:12px 0 18px}
.panel-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.panel-head h2{font-size:1.6rem;font-weight:900;color:var(--panel-ink)}
.panel-head .big{font-family:var(--mono);font-size:.85rem;color:var(--panel-muted)}
.prow{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--panel-2)}
.tagl{background:#F4F6F8;color:#0B1729;border-radius:3px;padding:2px 8px;font-size:.8rem;font-weight:700;line-height:1.5;box-shadow:inset 0 -2px 0 rgba(11,23,41,.12);justify-self:start}
.tagl small{display:block;font-family:var(--mono);font-weight:400;font-size:.7rem;color:#4A5C75}
.leds{display:flex;flex-wrap:wrap;gap:4px;direction:rtl;padding-top:3px}
.led{width:11px;height:11px;border-radius:2px;background:var(--led-off);border:0;padding:0;cursor:pointer}
.led.ok{background:var(--led-ok);box-shadow:0 0 5px rgba(34,211,238,.6)}
.led.part{background:var(--led-part)}
.led.bad{background:var(--led-bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--panel-muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-left:5px;vertical-align:middle}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.card+.card{margin-top:14px}
.card h3{font-size:1.2rem;margin-bottom:10px}
.resume{border-color:var(--cyan);background:var(--cyan-soft)}
.navlist{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.navlist .btn{text-align:center}
@media (max-width:520px){.navlist{grid-template-columns:1fr}}

/* exam */
.ehead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.ehead-in{max-width:760px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.ehead .ttl{font-weight:700}
.ehead .meta{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:2px;max-width:760px;margin:0 auto;padding:0 16px 8px}
.strip span{height:5px;border-radius:1px;background:var(--line)}
.strip span.ans{background:var(--muted)}
.strip span.ok{background:var(--led-ok)}
.strip span.part{background:var(--led-part)}
.strip span.bad{background:var(--led-bad)}
.strip span.cur{outline:2px solid var(--ink);outline-offset:1px}
.ports{background:var(--panel);border-radius:10px;padding:10px;display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:12px 0}
@media (max-width:420px){.ports{grid-template-columns:repeat(8,1fr)}}
.port{aspect-ratio:1/1;border-radius:4px;border:1px solid #2B4268;background:#0E1C33;color:#8FA3C2;font-family:var(--mono);font-size:.72rem;display:grid;place-items:center;position:relative;padding:0;min-height:30px}
.port::after{content:"";position:absolute;top:3px;left:3px;width:5px;height:5px;border-radius:50%;background:#24395A}
.port.ans::after{background:#7F93B0}
.port.ok::after{background:var(--led-ok);box-shadow:0 0 4px var(--led-ok)}
.port.part::after{background:var(--led-part)}
.port.bad::after{background:var(--led-bad)}
.port.cur{border-color:var(--led-ok);color:#fff}
.qmeta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.85rem;color:var(--muted);margin-bottom:10px}
.qmeta .ch{font-weight:700;color:var(--ink)}
.qtext{font-size:1.18rem;font-weight:500;line-height:1.5;margin:0 0 14px}
.opts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:right;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;min-height:48px}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.85rem;font-weight:700}
.opt .t{flex:1;min-width:0}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.sel .k{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--cyan-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default;opacity:1}
textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 12px;resize:vertical;line-height:1.5}
textarea.cli{min-height:160px;font-size:.92rem}
.fb{margin-top:14px;border-radius:8px;padding:12px 14px;border:1px solid var(--line);background:var(--surface2)}
.fb.ok{border-color:var(--ok);background:var(--cyan-soft)}
.fb.part{border-color:var(--amber);background:var(--amber-soft)}
.fb.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb h4{margin:0 0 6px;font-size:1rem}
.fb .lbl{font-size:.82rem;color:var(--muted);margin:10px 0 2px;font-weight:700}
.note{margin-top:10px;border-inline-start:3px solid var(--amber);padding:4px 10px;font-size:.92rem}
.note b{display:block;font-size:.8rem;color:var(--amber)}
.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap}
.actions .row{gap:8px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--cyan);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-inline-end:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.selfgrade{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* results */
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.score .n{font-family:var(--serif);font-size:4rem;font-weight:900;line-height:1}
.score .of{color:var(--muted)}
.bars{display:grid;gap:6px;margin-top:6px}
.bar{display:grid;grid-template-columns:minmax(120px,40%) 1fr 48px;gap:10px;align-items:center;font-size:.9rem}
.bar .track{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--cyan)}
.bar.weak .fill{background:var(--amber)}
.bar .pct{font-family:var(--mono);font-size:.8rem;text-align:left;direction:ltr}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.88rem;min-height:34px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rv{border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:8px}
.rv>button{display:flex;gap:10px;width:100%;text-align:right;background:none;border:0;padding:12px 14px;align-items:flex-start}
.rv .num{font-family:var(--mono);font-size:.8rem;color:var(--muted);flex:none;width:24px;padding-top:2px}
.rv .st{flex:none;width:10px;height:10px;border-radius:2px;margin-top:7px;background:var(--line)}
.rv .st.ok{background:var(--led-ok)} .rv .st.part{background:var(--led-part)} .rv .st.bad{background:var(--led-bad)} .rv .st.pend{background:transparent;border:2px solid var(--amber)}
.rv .body{padding:0 14px 14px}
.kv{margin:8px 0}
.kv .lbl{font-size:.82rem;color:var(--muted);font-weight:700}
.aibox{margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface2)}
.aibox ul,.aibox ol,.msg ul,.msg ol{margin:.2em 0 .6em;padding-inline-start:1.2em}
.mini{margin-top:10px;border:1px dashed var(--cyan);border-radius:8px;padding:12px}

/* bank */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:10px 0}
.tabs .chip{white-space:nowrap}
.search{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);min-height:44px}
.subh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 6px}
.subh h3{font-size:1.1rem}
.bq{border-bottom:1px solid var(--line)}
.bq>button{display:flex;gap:10px;width:100%;text-align:right;background:none;border:0;padding:10px 2px;align-items:flex-start}
.bq .body{padding:0 2px 12px 0}

/* history */
.hrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:right}
.hrow .sc{font-family:var(--mono);font-weight:500;font-size:1.1rem}

/* modal + drawer */
.scrim{position:fixed;inset:0;background:rgba(5,12,24,.55);z-index:30;display:none}
.scrim.show{display:block}
.modal{position:fixed;z-index:31;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:none}
.modal.show{display:block}
.modal h3{margin-bottom:8px}
.drawer{position:fixed;z-index:32;background:var(--surface);border:1px solid var(--line);display:none;flex-direction:column}
.drawer.show{display:flex}
@media (min-width:900px){
  .drawer{top:0;bottom:0;left:0;width:420px;border-radius:0;border-width:0 0 0 1px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
}
@media (max-width:899px){
  .drawer{left:0;right:0;bottom:0;height:min(82%,680px);border-radius:14px 14px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dh h3{font-size:1.1rem}
.dh .sub{font-size:.8rem;color:var(--muted)}
.msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;border-radius:10px;padding:8px 12px;font-size:.95rem}
.msg.u{align-self:flex-start;background:var(--ink);color:var(--bg)}
.msg.a{align-self:flex-end;background:var(--surface2)}
.msg.err{border:1px solid var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}
.din{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);align-items:flex-end}
.din textarea{min-height:44px;height:44px;max-height:140px;flex:1}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;z-index:40;font-size:.9rem;display:none}
.toast.show{display:block}
.foot{margin-top:28px;font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
</style>
</head>
<body>
<div id="app"></div>
<div class="scrim" id="scrim"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt"></h3><p id="mb" class="muted"></p><div class="row end" id="mf"></div></div>
<aside class="drawer" id="drawer" aria-label="המורה הדיגיטלי">
  <div class="dh"><div><h3>המורה הדיגיטלי</h3><div class="sub" id="dsub"></div></div><button class="btn sm ghost" data-act="tclose">סגירה</button></div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <div class="chips" id="tchips"></div>
  <form class="din" id="tform"><textarea id="tin" placeholder="מה לא ברור?" aria-label="שאלה למורה"></textarea><button class="btn primary sm" id="tsend" type="submit">שליחה</button></form>
</aside>
<div class="toast" id="toast" role="status"></div>
<script>
"use strict";
const VERSION="1.2";
const B=[];
// פרק תקשורת — 75 שאלות. מבנה פריט: [תת-נושא, מס׳ בחוברת, שאלה, תשובת מפתח, אפשרויות (הנכונה ראשונה), תוספות]
B.push(
["c1",1,"מהם שלושת מגזרי מערך התקשוב?","בניין הכוח, הפעלת הכוח ומימוש הכוח.",["בניין הכוח, הפעלת הכוח, מימוש הכוח","תכנון הכוח, הפעלת הכוח, תחזוקת הכוח","בניין הכוח, הכשרת הכוח, אבטחת הכוח","מטה, מבצעים, לוגיסטיקה"]],
["c1",2,"מה כולל מגזר ״בניין הכוח״?","מחלקת תקשוב.",["מחלקת תקשוב","ענף תקשוב למבצעים","יחידה 502","גפי התקשוב בבסיסים"]],
["c1",3,"מה כולל מגזר ״הפעלת הכוח״?","ענף תקשוב למבצעים ויחשת״פ.",["ענף תקשוב למבצעים ויחשת״פ","מחלקת תקשוב","יחידה 502 וגפי התקשוב","יב״אות בלבד"]],
["c1",4,"מה כולל מגזר ״מימוש הכוח״?","יחידה 502, גפי התקשוב ויב״אות.",["יחידה 502, גפי התקשוב ויב״אות","מחלקת תקשוב","ענף תקשוב למבצעים ויחשת״פ","מחלקת תקשוב ויחשת״פ"]],
["c1",5,"סדר את מסלול ההכשרה במקצוע: הכשרה ראשונית, הכשרה מתקדמת סף, נקודה יצרנית, הכשרה מתקדמת רף.","הכשרה ראשונית ← נקודה יצרנית ← הכשרה מתקדמת רף ← הכשרה מתקדמת סף.",["הכשרה ראשונית ← נקודה יצרנית ← הכשרה מתקדמת רף ← הכשרה מתקדמת סף","הכשרה ראשונית ← הכשרה מתקדמת סף ← נקודה יצרנית ← הכשרה מתקדמת רף","הכשרה ראשונית ← הכשרה מתקדמת רף ← הכשרה מתקדמת סף ← נקודה יצרנית","נקודה יצרנית ← הכשרה ראשונית ← הכשרה מתקדמת סף ← הכשרה מתקדמת רף"],{mq:"מהו הסדר הנכון של מסלול ההכשרה במקצוע?"}],
["c2",6,"מהם ארבעת הדברים הנחוצים ליצירת תקשורת?","שפה משותפת (שני הצדדים מדברים באותו פרוטוקול), צד שולח וצד מקבל, אמצעי להעברת המידע (תווך), וחוקים שלפיהם יעבור המידע.",["שפה משותפת, שולח ומקבל, אמצעי להעברת מידע, חוקים להעברת המידע","שולח, מקבל, נתב ומתג","כתובת IP, כתובת MAC, כבל וספק כוח","מקודד, מפענח, מגבר ואנטנה"]],
["c2",7,"ממה מורכב המבנה העקרוני של רשת תקשורת?","משתמשים (Users) — המנויים לרשת; ממשקי גישה (Applications) — המקשרים בין המשתמשים לרשת; תווך (Backbone) — הרשת עצמה שמקשרת בין המשתמשים.",["משתמשים, ממשקי גישה ותווך","שרתים, לקוחות וחומת אש","שכבה פיזית, שכבת רשת ושכבת יישום","מתגים, נתבים ונקודות קצה"]],
["c2",8,"ציין שלושה הבדלים בין תקשורת אנלוגית לספרתית.","לפי החוברת: אנלוגית משדרת לטווחים ארוכים יותר; יישום אנלוגי זול יותר; אנלוגית רגישה יותר לרעשים.",["תקשורת אנלוגית רגישה יותר לרעשים מתקשורת ספרתית","תקשורת ספרתית רגישה יותר לרעשים מתקשורת אנלוגית","יישום תקשורת אנלוגית יקר יותר מיישום ספרתית","תקשורת ספרתית אינה צריכה תווך פיזי"],{mq:"איזה מההיגדים הבאים הוא הבדל נכון בין תקשורת אנלוגית לספרתית?",n:"בחוברת כתוב שאנלוגית מגיעה לטווחים ארוכים יותר. בפועל, אות ספרתי עובר שחזור (Regeneration) בדרך ולכן מגיע רחוק בלי שהרעש מצטבר. כדאי לזכור את תשובת החוברת, אבל ההבדל הבטוח ביותר הוא הרגישות לרעש."}],
["c2",9,"מהי תקשורת טורית ומהי תקשורת מקבילית?","טורית: העברת מידע מנקודה לנקודה על קו פיזי אחד, סיבית אחר סיבית. מקבילית: העברת מידע על כמה קווים פיזיים במקביל.",["טורית — סיבית אחר סיבית על קו אחד; מקבילית — כמה סיביות במקביל על כמה קווים","טורית — כמה קווים במקביל; מקבילית — קו אחד","טורית — שידור לכל התחנות; מקבילית — שידור לתחנה אחת","טורית — עם קו שעון; מקבילית — בלי קו שעון"]],
["c2",10,"מהי תקשורת אסינכרונית וממה בנוי ה-BYTE שלה? פרט והסבר.","תקשורת שאין בה קו שעון משותף. כל BYTE (8 סיביות) נשלח עם 2 סיביות נוספות: START BIT שמסמנת את תחילת הבית ו-STOP BIT שמסמנת את סופו (START | BYTE | STOP).",["אין קו שעון משותף; כל בית נשלח עם START BIT בתחילתו ו-STOP BIT בסופו","יש קו שעון משותף; המידע נשלח במסגרות ארוכות עם FLAG","אין קו שעון; המידע נשלח בלי סיביות מסגור","יש קו שעון משותף; כל בית נשלח עם סיבית זוגיות בלבד"]],
["c2",11,"מהי תקשורת סינכרונית וממה בנויה המסגרת שלה? פרט והסבר.","תקשורת שיש בה קו שעון משותף. משדרים כמות גדולה של סיביות בתוך מסגרת (FRAME) ארוכה: FLAG/SYNC בתחילתה, בתים של מידע, ו-FLAG/SYNC בסופה.",["יש קו שעון משותף; מסגרת ארוכה שמתחילה ומסתיימת ב-FLAG/SYNC ובאמצע בתי מידע","אין קו שעון; כל בית עם START ו-STOP","יש קו שעון; כל סיבית נשלחת במסגרת נפרדת","אין קו שעון; המסגרת מתחילה ב-PREAMBLE ומסתיימת ב-FCS"]],
["c2",12,"בשיטת HALF DUPLEX, כאשר תחנה A שולחת הודעה לתחנה B, האם תחנה B תוכל לשלוח הודעה בו־זמנית?","לא. ב-HALF DUPLEX יש קו אחד ששני הצדדים מעבירים עליו מידע, ולכן שידור בו־זמני יגרום להתנגשות.",["לא — יש קו אחד משותף, ושידור בו־זמני יגרום להתנגשות","כן — כל צד משדר בתדר אחר","כן — זו בדיוק ההגדרה של HALF DUPLEX","לא — ב-HALF DUPLEX רק תחנה A יכולה לשדר אי פעם"]],
["c3",13,"סדר את השכבות של מודל ה-OSI.","1 פיזית (Physical), 2 עורק (Data Link), 3 רשת (Network), 4 תעבורה (Transport), 5 שיחה (Session), 6 הצגה (Presentation), 7 יישום (Application).",["פיזית, עורק, רשת, תעבורה, שיחה, הצגה, יישום","פיזית, רשת, עורק, תעבורה, הצגה, שיחה, יישום","עורק, פיזית, רשת, תעבורה, שיחה, יישום, הצגה","פיזית, עורק, תעבורה, רשת, שיחה, הצגה, יישום"],{mq:"מהו הסדר הנכון של שכבות מודל ה-OSI, משכבה 1 עד שכבה 7?"}],
["c3",14,"באיזו שכבה המידע מחולק ל-BITS?","בשכבה הפיזית (1). היא אחראית על שידור ביטים גולמיים בערוץ ועל כך שהאותות החשמליים, האופטיים או הרדיו יועברו ויתקבלו כראוי.",["השכבה הפיזית","שכבת העורק","שכבת הרשת","שכבת התעבורה"]],
["c3",15,"הסבר מהי כתובת MAC, כיצד היא בנויה ובאיזו שכבה היא מיושמת.","כתובת פיזית ייחודית שמזהה כל כרטיס רשת או התקן תקשורת. 48 סיביות: 24 הראשונות הן קידומת היצרן, ו-24 האחרונות הן מספר סידורי של ההתקן. מיושמת בשכבת העורק (2).",["48 סיביות: 24 קידומת יצרן ו-24 מספר סידורי; שכבה 2","32 סיביות בארבעה מקטעים; שכבה 3","48 סיביות: 24 כתובת רשת ו-24 כתובת תחנה; שכבה 3","64 סיביות שנקבעות על ידי שרת DHCP; שכבה 2"],{mq:"כמה סיביות יש בכתובת MAC, כיצד הן מחולקות ובאיזו שכבה היא מיושמת?",v:[["איזו כתובת משמשת לזיהוי פיזי של כרטיס רשת, וצרובה עליו על ידי היצרן?",["כתובת MAC","כתובת IP","Default Gateway","Subnet Mask"]]]}],
["c3",16,"הסבר מהי כתובת IP, כיצד היא בנויה ובאיזו שכבה היא מיושמת.","כתובת לוגית לזיהוי נקודות ברשתות שמשתמשות בפרוטוקול IP. בנויה מ-32 סיביות בארבעה מקטעים של 8 סיביות (למשל 192.21.30.68). מיושמת בשכבת הרשת (3), שתפקידה להעביר מנות (Packets) בין רשתות שונות.",["כתובת לוגית של 32 סיביות בארבעה מקטעים של 8; שכבה 3","כתובת פיזית של 48 סיביות; שכבה 2","כתובת לוגית של 48 סיביות בשישה מקטעים; שכבה 3","כתובת פיזית של 32 סיביות; שכבה 4"],{mq:"מה נכון לגבי כתובת IP (גרסה 4)?"}],
["c3",17,"איזו שכבה במודל מפקחת על תעבורת המידע ברשת?","שכבת התעבורה (4). מאפשרת תקשורת אמינה מקצה לקצה, מנהלת בקרת שגיאות ואמינות, מפקחת על זרימת הנתונים כדי לא להציף את המקבל, ומחלקת את המידע למקטעים (Segments).",["שכבת התעבורה","שכבת השיחה","שכבת הרשת","שכבת ההצגה"]],
["c3",18,"איזו שכבה אחראית על הקמת שיחה וניתוקה?","שכבת השיחה (5). יוצרת, מנהלת וסוגרת שיחה בין שני הצדדים, דואגת לסנכרון, מאפשרת לחדש תקשורת שנקטעה וקובעת אם השיחה חד־כיוונית או דו־כיוונית.",["שכבת השיחה","שכבת התעבורה","שכבת היישום","שכבת העורק"]],
["c3",19,"איזו שכבה אחראית על הצפנת המידע?","שכבת ההצגה (6). אחראית על תרגום פורמטים, קידוד, דחיסה, הצפנה ופענוח — כדי ששני הצדדים ״יבינו״ זה את זה.",["שכבת ההצגה","שכבת השיחה","שכבת התעבורה","שכבת הרשת"]],
["c3",20,"איזו שכבה מהווה ממשק בין המשתמש לרשת?","שכבת היישום (7). אחראית על זמינות התקשורת מול הצד השני, למשל אפליקציית וואטסאפ או דפדפן.",["שכבת היישום","שכבת ההצגה","שכבת השיחה","השכבה הפיזית"]],
["c3",21,"מהו תהליך האריזה?","כששולחים מידע, הנתונים נעטפים בכל שכבה בכותרת (HEADER) שמאפיינת את הפרוטוקול שלה, לפני העברתם ברשת, ובין היתר מתחלקים למנות מידע. בצד המקבל מתבצע תהליך הפוך של פריקה.",["עטיפת הנתונים בכל שכבה בכותרת (Header) של הפרוטוקול לפני השליחה","דחיסת הקבצים לפני שמירה בדיסק","הצפנת המידע בשכבת ההצגה בלבד","חיבור כמה כבלים פיזיים לקו לוגי אחד"]],
["c3",22,"התאם בין השכבות במודל TCP/IP למודל OSI.","NETWORK ACCESS = פיזית + עורק; INTERNET = רשת; HOST-TO-HOST = תעבורה; APPLICATION = שיחה + הצגה + יישום.",["APPLICATION: שיחה, הצגה ויישום; HOST-TO-HOST: תעבורה; INTERNET: רשת; NETWORK ACCESS: פיזית ועורק","APPLICATION: יישום בלבד; HOST-TO-HOST: שיחה ותעבורה; INTERNET: רשת ועורק; NETWORK ACCESS: פיזית","APPLICATION: הצגה ויישום; HOST-TO-HOST: שיחה; INTERNET: תעבורה ורשת; NETWORK ACCESS: פיזית ועורק","APPLICATION: שיחה, הצגה ויישום; HOST-TO-HOST: רשת; INTERNET: עורק; NETWORK ACCESS: פיזית"],{mq:"איזו התאמה בין מודל TCP/IP למודל OSI נכונה?",v:[["לאיזו שכבה במודל OSI מתאימה שכבת INTERNET במודל TCP/IP?",["שכבת הרשת","שכבת העורק","שכבת התעבורה","שכבת היישום"]]]}],
["c4",23,"מהו זוג שזור?","כבל שמורכב מזוגות חוטי נחושת מבודדים זה מזה, הכרוכים (שזורים) זה סביב זה, ועליהם בידוד נוסף. השזירה מקטינה הפרעות. סוגים: UTP (ללא סיכוך) ו-STP (עם סיכוך).",["זוגות חוטי נחושת מבודדים הכרוכים זה סביב זה, עם בידוד חיצוני","סיב זכוכית עם ליבה וציפוי","מוליך נחושת יחיד עם רשת סיכוך סביבו (קואקסיאלי)","שני סיבים אופטיים — אחד לשידור ואחד לקליטה"]],
["c4",24,"מהו RJ-45?","מחבר סטנדרטי לחיבור רשתות, עם 8 גידי נחושת בשורה, לכבלי זוג שזור (UTP/STP). ב-10/100Mbps משתמשים ב-4 גידים (1, 2, 3, 6); ב-1Gbps בכל 8 הגידים.",["מחבר 8 גידים לכבלי זוג שזור; ב-10/100Mbps משתמשים ב-4 גידים וב-1Gbps בכל ה-8","מחבר 9 פינים לכבל קונסול בצד המחשב","מחבר 4 גידים לקו טלפון אנלוגי","מחבר לסיב אופטי מסוג Single Mode"],{n:"בחוברת כתוב שגידים 1 ו-2 לקליטה ו-3 ו-6 לשידור. זה נכון מצד המתג; בכרטיס הרשת של המחשב זה הפוך (1,2 שידור; 3,6 קליטה). לכן כבל ישר מחבר ביניהם."}],
["c4",25,"מה ההבדל בין כבל ישר לכבל מוצלב?","כבל ישר: כל הגידים מחוברים באותו סדר בשני הצדדים; מחבר ציודים מסוגים שונים (מחשב–מתג, נתב–מתג). כבל מוצלב: גידי השידור בצד אחד מחוברים לגידי הקליטה בצד השני (1↔3, 2↔6); מחבר ציודים זהים (מחשב–מחשב, מתג–מתג).",["ישר — לציודים שונים (מחשב–מתג); מוצלב — לציודים זהים (מתג–מתג)","ישר — לציודים זהים; מוצלב — לציודים שונים","ישר — לסיבים; מוצלב — לנחושת","ישר — לחיבור קונסול; מוצלב — לחיבור לאינטרנט"],{v:[["איזה כבל נשתמש בו כדי לחבר מתג למתג (ללא Auto-MDIX)?",["כבל מוצלב","כבל ישר","כבל קונסול","כבל הפוך (Rollover)"]]]}],
["c4",26,"איזה סוג כבל הוא כבל CONSOLE?","כבל הפוך (Rollover). מתחבר ליציאת ה-Console של נתב או מתג Cisco לצורך הגדרתו; בצידו השני מחבר DB9 בעל 9 פינים (למחשב).",["כבל הפוך (Rollover) — RJ-45 לפורט הקונסול ו-DB9 בצד המחשב","כבל ישר — RJ-45 בשני הצדדים","כבל מוצלב — RJ-45 בשני הצדדים","כבל סיב — SFP בשני הצדדים"]],
["c4",27,"מהו SFP?","Small Form-factor Pluggable — רכיב שמתאם בין כבל סיב אופטי או כבל נחושת לבין ציוד כמו מתג או נתב. מאפשר להשתמש באותו ציוד גם עם נחושת וגם עם סיבים.",["מודול מתאם שמחבר סיב אופטי או נחושת לפורט במתג או בנתב","פרוטוקול לגילוי שכנים","סוג של כבל קונסול","תקן לחיבור דיסקים קשיחים"]],
["c4",28,"מהו מחבר ה-BASE-T/F?","מחבר במהירויות 10/100/1000Mbps. BASE = Baseband (שיטת השידור), T = Twisted Pair (זוג שזור), F = Fiber (סיב אופטי).",["BASE = Baseband (שיטת השידור), T = זוג שזור, F = סיב אופטי","BASE = כבל בסיס, T = Telephone, F = Fast","BASE = Broadband, T = Transmit, F = Full Duplex","BASE = מהירות בסיס, T = Trunk, F = Frame"],{mq:"במונחים כמו 100BASE-T או 1000BASE-F, מה מציינים BASE, T ו-F?"}],
["c4",29,"באילו מהירויות תומכים המחברים ETHERNET, FASTETHERNET ו-GIGAETHERNET?","Ethernet — 10Mbps; FastEthernet — 100Mbps; GigaEthernet — 1000Mbps (1Gbps).",["10Mbps, 100Mbps, 1000Mbps","100Mbps, 1000Mbps, 10Gbps","10Mbps, 54Mbps, 100Mbps","1Mbps, 10Mbps, 100Mbps"],{mq:"מה המהירויות של Ethernet, FastEthernet ו-GigaEthernet (לפי הסדר)?",v:[["באיזו מהירות תומך פורט FastEthernet?",["100Mbps","10Mbps","1000Mbps","10Gbps"]]]}],
["c5",30,"מהו רעש? אילו סוגי רעשים קיימים?","רעש הוא אות בלתי רצוי שמפריע לקליטת האות הרצוי. סוגים: רעש לבן — נגרם מתנועת אלקטרונים בחומר, משפיע על כל התדרים ותלוי בטמפרטורה; פיקים — קפיצות מתח קצרות (ברקים, ניצוצות, מנועים); רעש ליקוט — השראה מקווי העברה סמוכים לקו התקשורת.",["רעש לבן, פיקים ורעש ליקוט","רעש לבן, רעש ורוד ורעש אדום","פיקים, הד ועיוות","רעש ליקוט, התנגשויות ואובדן מנות"],{mq:"אילו שלושה סוגי רעשים מוזכרים בחומר?",v:[["איזה סוג רעש נגרם מהשראה של קווי העברה הנמצאים בסמוך לקו התקשורת?",["רעש ליקוט","רעש לבן","פיקים","רעש תרמי"]]]}],
["c5",31,"מהו המבנה העקרוני של סיב אופטי?","ליבה (Core) — החלק המרכזי שבו עובר האור, עשויה סיליקה, בעלת מקדם שבירה גבוה; ציפוי (Cladding) — עוטף את הליבה, מקדם שבירה נמוך יותר, יוצר החזרת אור מלאה לתוך הליבה; מעטה (Jacket) — מגן ומקנה גמישות. המידע עובר כאור (1) והיעדר אור (0).",["ליבה, ציפוי בעל מקדם שבירה נמוך יותר, ומעטה מגן","ליבת נחושת, בידוד ורשת סיכוך","ליבה, מגבר ומחבר RJ-45","ציפוי, ליבה בעלת מקדם שבירה נמוך יותר, ומעטה"],{v:[["מדוע לציפוי (Cladding) של סיב אופטי יש מקדם שבירה נמוך מזה של הליבה?",["כדי ליצור החזרה מלאה של האור לתוך הליבה","כדי להגן על הסיב מפני כיפוף","כדי לאפשר העברת חשמל לצד המידע","כדי להאט את קרן האור ולמנוע התנגשויות"]]]}],
["c5",32,"מה ההבדל בין סיב MULTIMODE לסיב SINGLEMODE?","Multi Mode: ליבה רחבה, נושא קרני אור רבות במסלולים שונים, מקור אור זול (LED). Single Mode: ליבה דקה שמאלצת קרן אור אחת בלבד, מקור אור לייזר יקר, ומתאים לטווחים ארוכים.",["MM — ליבה רחבה, קרניים רבות, LED; SM — ליבה דקה, קרן אחת, לייזר","MM — ליבה דקה, לייזר; SM — ליבה רחבה, LED","MM — לנחושת; SM — לסיב","MM — לטווחים ארוכים; SM — לטווחים קצרים בלבד"]],
["c6",33,"מהי טופולוגיה, ומהי טופולוגיה פיזית ולוגית?","טופולוגיה מתארת את הסידור הפיזי או הלוגי של הציודים ברשת. פיזית — הציודים והקווים כפי שהם בפועל (כבלים, סיבים, מחברים). לוגית — הקשרים הלוגיים, מיקום התקנים לפי כתובות (למשל IP) ולא לפי מיקום פיזי; למשל ארבעה קווים פיזיים יכולים להיראות כקו לוגי אחד.",["פיזית — הקווים והציודים בפועל; לוגית — הקשרים הלוגיים (למשל לפי כתובות IP)","פיזית — לפי כתובות IP; לוגית — לפי כבלים","פיזית — ברשת אלחוטית; לוגית — ברשת קווית","פיזית ולוגית הן שמות שונים לאותו דבר"]],
["c6",34,"איזו טופולוגיה אבחר כשארצה שרידות מקסימלית ברשת?","רשת יהלום (Full Mesh) — כל עמדה מחוברת ישירות לכל העמדות האחרות.",["רשת יהלום (Mesh מלאה) — כל עמדה מחוברת ישירות לכל האחרות","כוכב","אפיק (Bus)","טבעת"]],
["c6",35,"מהו החיסרון בטופולוגיית ״כוכב״?","כל העמדות מתחברות לעמדה מרכזית אחת, ולכן אם היא נופלת — אין תקשורת בין שאר העמדות (נקודת כשל יחידה).",["נפילת הרכיב המרכזי משביתה את התקשורת בין כל העמדות","כל עמדה צריכה כבל לכל עמדה אחרת","אי אפשר להוסיף עמדות חדשות","המידע עובר בכל העמדות עד שמגיע ליעד"]],
["c6",36,"מה ההבדל בין RIT ל-ODF?","RIT — פאנל מחברי נחושת (RJ-45) בארון התקשורת; כל נקודה בו היא ״נקודה שקופה״ — העתק של נקודת הקצה בקיר. מאפשר לבודד תקלה בין המחשב למתג. ODF — אותה מטרה ואופן פעולה, אך לסיבים אופטיים.",["RIT — פאנל לנחושת (RJ-45); ODF — פאנל לסיבים אופטיים","RIT — לסיבים; ODF — לנחושת","RIT — מתג; ODF — נתב","RIT — שרת קבצים; ODF — שרת גיבוי"]],
["c6",37,"מהו BCC ומהו SBC?","BCC (Base Communication Control) — האתר הראשי שבו יושבים פיזית כל ציודי התקשורת. SBC (Second Base Communication) — אתר גיבוי עם ציודים זהים לציודים הקריטיים ב-BCC, לשרידות.",["BCC — אתר התקשורת הראשי; SBC — אתר גיבוי עם ציודים קריטיים זהים","BCC — אתר גיבוי; SBC — אתר ראשי","BCC — סוג כבל; SBC — סוג מחבר","BCC — שרת דוא״ל; SBC — שרת DNS"]],
["c7",38,"מה ההבדל בין הודעת BROADCAST להודעת MULTICAST?","Broadcast — נשלחת ממקור אחד לכל התחנות ברשת. Multicast — חבילה אחת נשלחת לקבוצה מוגדרת של רכיבי רשת.",["Broadcast — לכל התחנות ברשת; Multicast — לקבוצה מוגדרת","Broadcast — לתחנה אחת; Multicast — לכל התחנות","Broadcast — רק בין נתבים; Multicast — רק בין מתגים","אין הבדל, אלה שני שמות לאותו דבר"]],
["c7",39,"מהם הדברים העיקריים שמשפיעים על COLLISION DOMAIN?","Collision Domain הוא המרחב שבו יכולה להיווצר התנגשות (רלוונטי בעיקר ב-Half Duplex). מושפע ממספר התחנות המחוברות לקו ומזמן השידור של התחנות.",["מספר התחנות המחוברות לקו וזמן השידור שלהן","סוג מערכת ההפעלה ונפח הזיכרון","אורך כתובת ה-IP וסוג המחבר","מספר ה-VLANים והפרוטוקול STP"]],
["c7",40,"הסבר את עיקרון הפעולה של רשת ETHERNET.","CSMA/CD: התחנה מאזינה לקו; אם הקו תפוס — ממשיכה להאזין; אם פנוי — משדרת ובמקביל מאזינה. אם זוהתה התנגשות — מפסיקה מיד, שולחת אות שגיאה (Jam), מחכה זמן קצר ומתחילה שוב להאזין.",["CSMA/CD — האזנה לקו, שידור כשהוא פנוי, ובהתנגשות עצירה, אות שגיאה והמתנה","Token Passing — רק מי שמחזיק אסימון משדר","CSMA/CA — הימנעות מהתנגשות באמצעות אישורים מראש","TDMA — לכל תחנה משבצת זמן קבועה"]],
["c7",41,"מה תפקיד שדה ה-PREAMBLE במסגרת ה-ETHERNET?","ליצור סנכרון בין השולח ליעד.",["סנכרון בין השולח למקבל","גילוי שגיאות","ציון כתובת היעד","ציון סוג הפרוטוקול"]],
["c7",42,"האם נשתמש בכתובת IP בשדות D.A ו-S.A במסגרת ה-ETHERNET?","לא. בשדות כתובת היעד (D.A) וכתובת המקור (S.A) במסגרת ה-Ethernet משתמשים בכתובות MAC.",["לא — בשדות אלה משתמשים בכתובות MAC","כן — שם נמצאות כתובות ה-IP","רק בשדה D.A","רק כאשר מדובר ב-Broadcast"]],
["c7",43,"מה תפקידו של שדה ה-FCS?","גילוי שגיאות במסגרת.",["גילוי שגיאות במסגרת","סנכרון בין השולח למקבל","ציון אורך המסגרת","ציון כתובת המקור"]],
["c7",44,"באיזו שכבה במודל ה-OSI פועל המתג?","בשכבה השנייה (עורק), כי הוא עובד עם כתובות MAC.",["שכבה 2 — עורק","שכבה 1 — פיזית","שכבה 3 — רשת","שכבה 4 — תעבורה"]],
["c7",45,"מהי טבלת ה-CAM?","טבלה במתג שאוגרת את כתובות ה-MAC שהוא מכיר ומקשרת אותן לפורטים שמהם למד אותן; בנוסף יודעת לשייך VLAN לפורט.",["טבלה במתג שמקשרת כתובות MAC לפורטים","טבלת ניתוב בנתב","טבלה שמקשרת כתובות IP לכתובות MAC במחשב","טבלת הכתובות של שרת DHCP"]],
["c7",46,"הסבר את השלבים שהמתג עובר בעת למידת כתובות MAC.","Learning — כשמגיעה מסגרת, המתג קורא את כתובת המקור ומוסיף לטבלה אם אינה קיימת. Flooding — אם כתובת היעד לא בטבלת ה-CAM, מציף את המסגרת לכל הפורטים כדי לגלות היכן היעד. Filtering — רק המחשב שההודעה מיועדת אליו מגיב, השאר זורקים אותה. Aging — כתובת ללא פעילות 5 דקות נמחקת. Forwarding — אם היעד ידוע, המסגרת נשלחת רק לפורט הרלוונטי.",["מציף (Flooding) את המסגרת לכל הפורטים מלבד הפורט שממנו הגיעה","זורק את המסגרת","שולח את המסגרת לנתב","שולח הודעת שגיאה לשולח"],{mq:"מה עושה המתג כשמגיעה מסגרת שכתובת היעד שלה אינה מופיעה בטבלת ה-CAM?",v:[["אחרי כמה זמן ללא פעילות נמחקת כתובת מטבלת ה-CAM (תהליך Aging), לפי החומר?",["5 דקות","30 שניות","24 שעות","הכתובת לעולם אינה נמחקת"]],["בשלב Learning, איזו כתובת קורא המתג מהמסגרת כדי לעדכן את הטבלה?",["כתובת ה-MAC של המקור","כתובת ה-MAC של היעד","כתובת ה-IP של היעד","כתובת ה-IP של המקור"]]]}],
["c8",47,"מהו VLAN?","טכנולוגיה שמאפשרת ליצור רשתות LAN וירטואליות (תתי־רשתות) על אותו מתג — חלוקה לוגית לרשתות נפרדות.",["חלוקה לוגית של מתג לכמה רשתות LAN וירטואליות נפרדות","רשת אלחוטית ארגונית","חיבור של כמה כבלים פיזיים לקו לוגי אחד","סוג של חומת אש"]],
["c8",48,"אם ארצה להעביר כמה VLANים בין מתג למתג, באיזה סוג עורק אשתמש?","עורק מסוג TRUNK.",["TRUNK","ACCESS","CONSOLE","EtherChannel בלבד"]],
["c8",49,"כיצד יודע המתג לזהות את ה-VLAN שאליו משויכת חבילה?","בזכות התיוג (TAGGING) במסגרת ה-Ethernet.",["לפי התיוג (Tagging) במסגרת ה-Ethernet","לפי כתובת ה-IP של המקור","לפי שדה ה-FCS","לפי כתובת ה-MAC של היעד בלבד"]],
["c8",50,"כיצד אעביר חבילה מ-VLAN ל-VLAN?","באמצעות נתב (או מתג רמה 3), שתפקידו להעביר מידע בין רשתות שונות.",["באמצעות נתב (או מתג רמה 3)","באמצעות מתג רמה 2 בלבד","באמצעות כבל מוצלב","באמצעות שרת DHCP"]],
["c8",51,"מה ההבדל בין VOICE VLAN ל-VLAN?","לפי החוברת: VOICE VLAN מעביר רק שמע (תעבורת הטלפון), ואילו VLAN רגיל מעביר גם שמע וגם מידע רגיל.",["VOICE VLAN ייעודי לתעבורת קול של הטלפון; VLAN רגיל משמש לנתונים","VOICE VLAN משמש לניהול המתג","VOICE VLAN עובר רק על סיבים אופטיים","VOICE VLAN הוא שם אחר ל-TRUNK"],{n:"בפועל מגדירים בפורט אחד גם VLAN לנתוני המחשב וגם Voice VLAN לטלפון, כדי להפריד את תעבורת הקול ולתת לה עדיפות."}],
["c8",52,"מהם ה-VOICE VLANים שבהם משתמשים בחיל האוויר?","310 ו-311.",["310 ו-311","10 ו-20","100 ו-200","1 ו-1002"]],
["c8",53,"אילו בעיות יכולות להיווצר בעת שימוש בתצורה מגובה (עם לולאות)?","MAC Flapping — הריסת טבלת ה-CAM, כי המתג לומד כתובות זהות משני פורטים שונים. Broadcast Storm — הפצת הודעות Broadcast בצורה אינסופית.",["MAC Flapping ו-Broadcast Storm","Collision ו-Jitter","IP Conflict ו-APIPA","Crosstalk ורעש לבן"]],
["c9",54,"הסבר ופרט את השלבים בפרוטוקול ה-STP.","1 בחירת ה-ROOT BRIDGE — המתג ״הטוב ביותר״ שאחראי על הטופולוגיה, לפי ערך PRIORITY (0–65535, ברירת מחדל 32768, הנמוך זוכה). 2 בחירת ROOT PORT — בכל מתג, הפורט שדרכו הדרך ״המהירה״ ביותר ל-ROOT, לפי ה-Cost של העורקים. 3 בחירת DESIGNATED PORT — פורטים שמעבירים תעבורה מול כל RP. 4 בחירת BLOCKING PORT — פורטים ועורקים שלא בשימוש נחסמים לוגית (לא מנתקים פיזית). 5 עדכון — ה-ROOT BRIDGE מפיץ הודעות ומעדכן את הטופולוגיה בשינויים.",["בחירת ה-Root Bridge","בחירת ה-Blocking Ports","בחירת ה-Designated Ports","חסימה פיזית של כבלים"],{mq:"מהו השלב הראשון בפרוטוקול STP?",v:[["מהו ערך ה-PRIORITY ברירת המחדל של מתג ב-STP?",["32768","0","65535","4096"]],["מה קורה לפורט במצב BLOCKING ב-STP?",["הוא נחסם לוגית (תוכנתית) והכבל נשאר מחובר","הכבל מנותק פיזית","הוא הופך ל-Root Port","הוא מעביר רק Broadcast"]]]}],
["c9",55,"אם יש שני מתגים עם אותו ערך PRIORITY, כיצד ייבחר ה-ROOT BRIDGE?","ייבחר המתג בעל כתובת ה-MAC הנמוכה ביותר.",["המתג בעל כתובת ה-MAC הנמוכה ביותר","המתג בעל כתובת ה-MAC הגבוהה ביותר","המתג שהודלק ראשון","המתג עם הכי הרבה פורטים"]],
["c10",56,"מהו תהליך הניתוב?","תהליך של בחירת הדרך הטובה ביותר (לפי מדדים שנקבעו) לשליחת חבילת מידע ברשת.",["בחירת הדרך הטובה ביותר לשליחת חבילה בין רשתות","למידת כתובות MAC","חלוקת כתובות IP","חסימת לולאות ברשת"]],
["c10",57,"בעזרת מה יתבצע תהליך הניתוב?","בעזרת הנתב.",["נתב","מתג רמה 2","רכזת (Hub)","RIT"]],
["c10",58,"מהם הממשקים הקיימים בנתב?","לפי החוברת: ממשק ה-CONSOLE, שדרכו הטכנאי מתחבר מקומית כדי להגדיר הגדרות, וממשק ה-AUXILIARY.",["Console ו-Auxiliary (AUX)","PS/2 ו-USB","VGA ו-HDMI","SATA ו-SAS"],{mq:"אילו שני ממשקי ניהול מוזכרים בחומר בנתב?",n:"בחוברת כתוב שממשק ה-AUX משמש להעתקת הגדרות מנתב לנתב. בפועל AUX משמש בעיקר לגישה מרחוק דרך מודם (ניהול מחוץ לרשת). בנוסף לממשקי הניהול יש לנתב ממשקי רשת (Ethernet, Serial) שדרכם עוברת התעבורה."}],
["c10",59,"מה הבעיה שפותר מתג רמה 3? ממה היא נובעת? איך הוא פותר אותה?","הבעיה: צוואר בקבוק בנתב — הנתב מנתב ואז ממתג אחרי מציאת ה-MAC המתאים ל-IP, וזה לוקח זמן ומוריד את קצב התעבורה (Delay). הפתרון: מתג רמה 3 מהיר יותר, ממתג בחומרה לפי MAC (טבלת CAM), ובנוסף מסוגל לנתב בין VLANים (משנה את שדה ה-Tagging) ומפריד מרחבי Broadcast כמו נתב.",["צוואר בקבוק בנתב; מתג רמה 3 ממתג בחומרה ומנתב בין VLANים מהר יותר","התנגשויות ב-Half Duplex; מתג רמה 3 מוסיף Collision Domains","מחסור בכתובות IP; מתג רמה 3 מחלק כתובות","לולאות ברשת; מתג רמה 3 מחליף את STP"]],
["c10",60,"מהם שלושת סוגי הניתוב?","ניתוב סטטי — מוגדר ידנית ע״י מנהל הרשת ואינו משתנה עם שינויי טופולוגיה. ניתוב דינמי — נלמד ע״י פרוטוקול ניתוב, מתעדכן מחזורית או בשינוי טופולוגיה. ניתוב ברירת מחדל — לאן לשלוח חבילה שיעדה לא בטבלת הניתוב, בדרך כלל לרשת גדולה יותר.",["סטטי, דינמי וברירת מחדל","Unicast, Multicast ו-Broadcast","Access, Trunk ו-EtherChannel","RIP, OSPF ו-ARP"],{v:[["איזה סוג ניתוב קובע לאן תישלח חבילה שכתובת היעד שלה אינה מופיעה בטבלת הניתוב?",["ניתוב ברירת מחדל","ניתוב סטטי","ניתוב דינמי","ניתוב Broadcast"]]]}],
["c10",61,"מהן שתי המשפחות בפרוטוקולי ניתוב ומה ההבדל ביניהן?","Distance Vector — מדד האיכות הוא מרחק (Hop Count = מספר הנתבים בדרך); הנתבים שולחים לשכנים את טבלת הניתוב כל פרק זמן. Link State — המדד הוא עלות (Cost) לפי רוחב פס ועומס; אחרי הלמידה הראשונית נשלחים רק עדכוני שינויים; היררכי — מחולק לאזורים.",["Distance Vector — לפי מספר קפיצות (Hops); Link State — לפי עלות/רוחב פס ועדכונים רק בשינוי","Distance Vector — לפי רוחב פס; Link State — לפי מספר קפיצות","Distance Vector — לניתוב סטטי; Link State — לניתוב ברירת מחדל","Distance Vector — ברשתות קוויות; Link State — ברשתות אלחוטיות"]],
["c10",62,"מהו פרוטוקול ICMP ואיפה משתמשים בו?","Internet Control Message Protocol — פרוטוקול בקרה לשליחת הודעות שגיאה ואבחון למנהלי רשת (למשל ping). פועל בשכבה השלישית, לצד IP.",["פרוטוקול בקרה להודעות שגיאה ואבחון (למשל ping), בשכבה 3","פרוטוקול לחלוקת כתובות IP","פרוטוקול להעברת קבצים","פרוטוקול להמרת שמות לכתובות"]],
["c10",63,"מהו פרוטוקול ARP ומתי נשתמש בו?","פרוטוקול שמאפשר למצוא את כתובת ה-MAC שמתאימה לכתובת IP ידועה. נשתמש בו כשאנחנו יודעים את ה-IP של היעד וצריכים את ה-MAC כדי לבנות את המסגרת.",["למצוא כתובת MAC לפי כתובת IP ידועה","למצוא כתובת IP לפי שם אתר","לקבל כתובת IP משרת","לבדוק קישוריות ברשת"],{n:"בחוברת כתוב ש-ARP עובד בשכבת התעבורה — זו טעות. ARP פועל בין שכבה 2 לשכבה 3 (מתרגם כתובת שכבה 3 לכתובת שכבה 2), ואינו קשור לשכבת התעבורה."}],
["c10",64,"הסבר ופרט על LOCAL ARP ועל REMOTE ARP.","Local ARP — כשהיעד באותה רשת: המקור שולח ARP Request ב-Broadcast (יעד FF-FF-FF-FF-FF-FF) עם כתובת ה-IP המבוקשת; תחנת היעד מחזירה ARP Reply ישירות עם ה-MAC שלה. Remote ARP — כשהיעד ברשת אחרת: הנתב מפריד מרחבי Broadcast, לכן התחנה שולחת ARP Request לכתובת ה-Default Gateway, לומדת את ה-MAC של הנתב ושולחת אליו; הנתב מנתב לרשת היעד ושם מבצע Local ARP כדי למצוא את ה-MAC של תחנת היעד.",["התחנה מבקשת את כתובת ה-MAC של ה-Default Gateway (הנתב) ושולחת אליו","התחנה שולחת Broadcast שעובר דרך הנתב לרשת היעד","התחנה שולחת ישירות ל-MAC של תחנת היעד","התחנה פונה לשרת DNS"],{mq:"ב-Remote ARP (היעד ברשת אחרת), את כתובת ה-MAC של מי מבקשת תחנת המקור?",v:[["לאיזו כתובת MAC נשלח ARP Request?",["FF-FF-FF-FF-FF-FF (Broadcast)","הכתובת של תחנת היעד","00-00-00-00-00-00","הכתובת של שרת ה-DHCP"]]]}],
["c10",65,"כיצד נבדיל פיזית בין מתג רמה 2 למתג רמה 3?","מתג רמה 2: בפאנל הקדמי 24/48 פורטי RJ-45 ב-10/100Mbps לתחנות, ועוד 4 פורטים של 1G — 2 SFP ו-2 RJ-45. מתג רמה 3: 24/48 פורטי RJ-45 ב-10/100/1000Mbps ועוד 4 ממשקי SFP, ובנוסף הוא מודולרי. בגב שניהם: ספק כוח ראשי, ספק חלופי וחיבור קונסול.",["למתג רמה 3 פורטים ב-10/100/1000Mbps ו-4 ממשקי SFP, והוא מודולרי","למתג רמה 3 אין פורט קונסול","למתג רמה 2 יש רק סיבים","מתג רמה 3 תמיד גדול פי שניים"]],
["c11",66,"מהו ה-THREE WAY HANDSHAKE?","שיטה אמינה להקמת חיבור ב-TCP בשלוש הודעות: SYN מהצד הפותח, SYN-ACK מהצד השני, ו-ACK לאישור. לפי החוברת: אחרי שידור, הצד השולח מחכה לאישור ACK ומשדר שוב אם לא התקבל, והצדדים מסכמים כמה מידע יישלח לפני אישור.",["SYN, אחריו SYN-ACK ואז ACK","ACK, אחריו SYN ואז FIN","Discover, אחריו Offer ואז Request","Request, אחריו Reply ואז Acknowledge"],{mq:"מהו הרצף הנכון של ה-Three Way Handshake ב-TCP?",n:"בחוברת ה-Three Way Handshake מתואר כמנגנון אישורים כללי. ההגדרה המקובלת היא שלוש הודעות להקמת חיבור: SYN, SYN-ACK, ACK. טוב להכיר את שתיהן."}],
["c11",67,"מה ההבדל בין TCP ל-UDP ואיפה הם מיושמים?","TCP — אמין, מבוסס חיבור (Connection Oriented): מחלק לסגמנטים וממספר אותם כדי שיגיעו בסדר הנכון, משתמש ב-Three Way Handshake, באישורים ובשידור חוזר. UDP — ללא חיבור ולא אמין: אין אישורים, תיקון שגיאות או שידור חוזר, ולכן מהיר יותר; משמש לקול ווידאו (VoIP). שניהם בשכבת התעבורה.",["TCP אמין ומבוסס חיבור; UDP ללא חיבור ומהיר — שניהם בשכבת התעבורה","TCP מהיר ולא אמין; UDP אמין — שניהם בשכבת הרשת","TCP לקול ווידאו; UDP להעברת קבצים","TCP בשכבה 2; UDP בשכבה 3"],{v:[["באיזה פרוטוקול נעדיף להשתמש להעברת שיחת קול (VoIP), ומדוע?",["UDP — כי הוא מהיר ואין בו המתנה לאישורים","TCP — כי הוא אמין ומשדר מחדש","ICMP — כי הוא פרוטוקול בקרה","ARP — כי הוא מוצא כתובות"]]]}],
["c11",68,"מהו פרוטוקול SMTP?","Simple Mail Transfer Protocol — פרוטוקול לשליחת דוא״ל. ההודעה נקלטת בשרת SMTP, נכנסת לתור ומועברת ליעד כשמגיע תורה. SMTP משמש לשליחה; לקבלה משתמשים ב-POP3.",["פרוטוקול לשליחת דוא״ל; לקבלה משתמשים ב-POP3","פרוטוקול לקבלת דוא״ל בלבד","פרוטוקול להעברת קבצים","פרוטוקול לניהול רשת"]],
["c11",69,"מה ההבדל בין FTP ל-TFTP?","שניהם להעברת קבצים. FTP — אמין (Reliable), מאפשר פעולות על קבצים ותיקיות (העברה, שינוי שמות וכו׳). TFTP — פשוט ולא אמין (Unreliable): אין אישורים ואין שידורים חוזרים, ואין ״ממשק״ — כדי לגשת לקובץ צריך לדעת בדיוק את הנתיב והשם.",["FTP אמין ומאפשר ניהול קבצים ותיקיות; TFTP פשוט, לא אמין ודורש נתיב ושם מדויקים","FTP לא אמין; TFTP אמין","FTP לשליחת דוא״ל; TFTP לקבלת דוא״ל","FTP להמרת שמות; TFTP להעברת קבצים"],{n:"בחוברת כתוב ש-FTP ״בעל ממשק גרפי״. FTP עצמו הוא פרוטוקול; יש לו תוכנות לקוח גרפיות. ההבדל המקצועי: FTP עובד מעל TCP (פורטים 20/21) עם הזדהות, ו-TFTP מעל UDP (פורט 69) בלי הזדהות."}],
["c11",70,"מהו פרוטוקול DNS?","Domain Name System — ממיר שמות דומיין לכתובות IP ולהפך. התקני הרשת לא מכירים שמות של אתרים, ולכן צריך להמיר אותם לכתובות IP.",["ממיר שמות דומיין לכתובות IP ולהפך","מחלק כתובות IP לתחנות","מוצא כתובת MAC לפי IP","מצפין את תעבורת האינטרנט"]],
["c11",71,"מה ההבדל בין HTTP ל-HTTPS?","HTTP — פרוטוקול לא מאובטח שבאמצעותו הדפדפן מתקשר עם השרת ומעביר את דפי האינטרנט. HTTPS — אינו פרוטוקול נפרד אלא HTTP עם תוספת יכולות אבטחה (הצפנה).",["HTTPS הוא HTTP עם תוספת אבטחה (הצפנה)","HTTPS מהיר יותר כי אינו מצפין","HTTP משמש לדוא״ל ו-HTTPS לאתרים","HTTPS עובד רק ברשתות פנימיות"]],
["c11",72,"מהו פרוטוקול DHCP ומהן שיטות חלוקת הכתובות ב-DHCP?","Dynamic Host Configuration Protocol — אחראי על חלוקה דינמית של כתובות IP ברשת. שיטות: ידנית — מנהל הרשת מגדיר כתובת לכל התקן; אוטומטית — מגדירים לשרת תחום כתובות; דינמית — כמו אוטומטית, אך עם הגבלת זמן.",["ידנית, אוטומטית ודינמית (עם הגבלת זמן)","סטטית, דינמית וברירת מחדל","Unicast, Multicast ו-Broadcast","Discover, Offer ו-Request"],{mq:"מהן שלוש שיטות חלוקת הכתובות ב-DHCP?"}],
["c11",73,"מהו שרת?","מחשב (לרוב חזק ממחשב ביתי) שמספק שירותים ללקוחות — מחשבים או תוכנות שמבקשים את שירותיו. גם תוכנה שמספקת שירותים לתוכנות לקוח נקראת שרת.",["מחשב או תוכנה שמספקים שירותים ללקוחות","כל מחשב שמחובר לאינטרנט","מתג רמה 3","מחשב נייד של מנהל הרשת"]],
["c11",74,"מהו FIREWALL?","חומת אש — מערכת תוכנתית או חומרתית לאבטחה ולמידור הרשת: חומה בין הרשת לאינטרנט שמונעת תקשורת לא רצויה וחדירה זדונית, ומפרידה סגמנטים.",["מערכת תוכנה או חומרה שמונעת תקשורת לא רצויה וממדרת את הרשת","פרוטוקול לחלוקת כתובות","סוג של כבל מוגן מאש","שרת לגיבוי קבצים"]],
["c11",75,"מה יכול להוות רכיבי קצה?","כל דבר שנמצא בקצה רשת התקשורת ונותן שירות למשתמשים: מחשבים, מדפסות, טלפונים, סורקים, מצלמות VC, עמדות קרן אור.",["מחשבים, מדפסות, טלפונים וסורקים","מתגים ונתבים בלבד","כבלים ומחברים","שרתי DNS ו-DHCP בלבד"]]
);

B.push(
["p1",1,"מהי ארכיטקטורה פיזית ולוגית, ומה ההבדל ביניהן?","ארכיטקטורה פיזית — צורת החיבור בפועל בשטח: איזה מתג מתחבר לאן ובאילו כבלים. ארכיטקטורה לוגית — צורת החיבור הווירטואלית, שנבנית מההגדרות על כל ציוד. דוגמה: ב-STP פורט נחסם לוגית, אך פיזית הכבל עדיין מחובר.",["פיזית — החיבורים והכבלים בפועל; לוגית — הרשת כפי שנבנית מההגדרות (למשל פורט חסום ב-STP)","פיזית — לפי כתובות IP; לוגית — לפי כבלים","פיזית — ב-Packet Tracer; לוגית — בשטח","אין הבדל ביניהן"]],
["p1",2,"מהם שלושת סוגי ההתחברות למתג?","חיבור מקומי — כבל CONSOLE מחובר פיזית למתג. חיבור מרוחק TELNET — דרך הרשת, לא מוצפן ולכן פחות מאובטח. חיבור מרוחק SSH — דומה ל-Telnet, אך המידע מוצפן ומאובטח.",["Console (מקומי), Telnet (מרוחק, לא מוצפן), SSH (מרוחק, מוצפן)","USB, HDMI ו-VGA","Console, FTP ו-DNS","Telnet, SSH ו-HTTP בלבד"],{v:[["מה ההבדל העיקרי בין Telnet ל-SSH?",["SSH מצפין את המידע; Telnet שולח אותו גלוי","Telnet מצפין; SSH לא","Telnet מקומי ו-SSH מרוחק","SSH עובד רק דרך כבל קונסול"]]]}],
["p1",3,"מהן ארבע רמות הגישה, ומה תפקידה של כל אחת?","User (Sw>) — צפייה מצומצמת בלי אפשרות לשנות; לשם נכנסים מיד אחרי ההתחברות. Privileged (Sw#) — שינויים מינימליים, בעיקר פקודות SHOW. Global Configuration (Sw(config)#) — שינויים שמשפיעים על כל הציוד: ממשקים, פרוטוקולים ותהליכים. Interface Configuration (Sw(config-if)#) — תת־רמה להגדרת ממשק ספציפי, למשל speed 100 על Fa0/5.",["Global Configuration — Sw(config)#","User — Sw>","Privileged — Sw#","Interface Configuration — Sw(config-if)#"],{mq:"באיזו רמת גישה מגדירים פרוטוקול או הגדרה שמשפיעים על כל המתג (למשל hostname)?",v:[["מהי רמת הגישה שבה נמצאים מיד אחרי ההתחברות למתג?",["User — Sw>","Privileged — Sw#","Global Configuration — Sw(config)#","Interface Configuration — Sw(config-if)#"]],["איזו פקודה מעבירה מרמת User לרמת Privileged?",["enable","configure terminal","login","exit"]]]}],
["p2",4,"הגדר שם למתג (למשל MEFAKED).","Sw>enable\nSw#configure terminal\nSw(config)#hostname MEFAKED",["enable\nconfigure terminal\nhostname MEFAKED","enable\nhostname MEFAKED","configure terminal\nname MEFAKED","enable\nconfigure terminal\nset name MEFAKED"],{cli:1,mq:"איזה רצף פקודות מגדיר את שם המתג ל-MEFAKED?"}],
["p2",5,"הגדר תיאור ״AVNET״ לפורט FASTETHERNET 0/5.","Sw>enable\nSw#configure terminal\nSw(config)#interface fastethernet 0/5\nSw(config-if)#description AVNET",["interface fastethernet 0/5\ndescription AVNET","interface fastethernet 0/5\nname AVNET","description fastethernet 0/5 AVNET","interface fastethernet 0/5\nbanner motd AVNET"],{cli:1,mq:"אחרי configure terminal — איזה רצף מגדיר תיאור AVNET לפורט Fa0/5?"}],

["p4",16,"שייך כמה חיבורים פיזיים בין שני מתגים לקו לוגי אחד.","Sw(config)#interface range fastethernet 0/1-5\nSw(config-if-range)#channel-group 3 mode on\nאת אותן פעולות מבצעים גם במתג השני, עם אותו מספר קבוצה. טכנולוגיה זו נקראת EtherChannel.",["interface range fastethernet 0/1-5\nchannel-group 3 mode on","interface range fastethernet 0/1-5\nswitchport mode trunk","interface fastethernet 0/1\nchannel 1-5","spanning-tree group 3"],{cli:1,mq:"איזה רצף מאחד את הפורטים Fa0/1–5 לקו לוגי אחד (EtherChannel)?",v:[["כשמגדירים EtherChannel בין שני מתגים, מה צריך לעשות במתג השני?",["אותן פעולות, עם אותו מספר קבוצה","שום דבר — מספיק להגדיר בצד אחד","להגדיר שם VLAN זהה בלבד","לכבות את STP"]]]}],
["p4",17,"צור VLAN בשם ״TARGIL״ ושייך אותו לפורט במתג.","Sw(config)#vlan 5\nSw(config-vlan)#name TARGIL\nSw(config-vlan)#exit\nSw(config)#interface fastethernet 0/5\nSw(config-if)#switchport mode access\nSw(config-if)#switchport access vlan 5",["vlan 5\nname TARGIL\ninterface fastethernet 0/5\nswitchport mode access\nswitchport access vlan 5","vlan TARGIL 5\ninterface fastethernet 0/5\nswitchport vlan 5","vlan 5\ndescription TARGIL\ninterface fastethernet 0/5\nswitchport mode trunk","interface vlan 5\nname TARGIL\nswitchport access vlan 5"],{cli:1,mq:"איזה רצף יוצר VLAN 5 בשם TARGIL ומשייך אליו את Fa0/5?"}],
["p4",18,"הדלק, הגדר מהירות 100Mb ותצורת עבודה FULL-DUPLEX על פורטים 1–6.","Sw(config)#interface range fastethernet 0/1-6\nSw(config-if-range)#no shutdown\nSw(config-if-range)#speed 100\nSw(config-if-range)#duplex full",["interface range fastethernet 0/1-6\nno shutdown\nspeed 100\nduplex full","interface fastethernet 0/1-6\nenable\nspeed 100 full","interface range fastethernet 0/1-6\nshutdown\nspeed 100\nduplex half","interface range fastethernet 0/1-6\nbandwidth 100\nfull-duplex on"],{cli:1,mq:"איזה רצף מדליק את Fa0/1–6, קובע מהירות 100 ו-Full Duplex?"}],
["p4",19,"צור VOICE VLAN ושייך אותו לפורט במתג.","Sw(config)#vlan 310\nSw(config-vlan)#name VoiceVlan\nSw(config-vlan)#exit\nSw(config)#interface fastethernet 0/5\nSw(config-if)#switchport mode access\nSw(config-if)#switchport voice vlan 310",["switchport voice vlan 310","switchport access vlan 310","switchport mode voice 310","voice-vlan enable 310"],{cli:1,mq:"בתוך ממשק הפורט — איזו פקודה משייכת את Voice VLAN 310?"}],
["p4",20,"צור ממשק וירטואלי לצורך חיבור מרחוק דרך פורט 6 במתג.","Sw(config)#vlan 199\nSw(config-vlan)#exit\nSw(config)#interface vlan 199\nSw(config-if)#ip address 180.21.199.44 255.255.0.0\nSw(config-if)#no shutdown\nSw(config-if)#exit\nSw(config)#interface fastethernet 0/6\nSw(config-if)#switchport mode access\nSw(config-if)#switchport access vlan 199\nהכתובת היא דוגמה. בחוברת הפורט בדוגמה הוא 0/21.",["interface vlan 199\nip address 180.21.199.44 255.255.0.0\nno shutdown","interface fastethernet 0/6\nip address 180.21.199.44 255.255.0.0","vlan 199\nip default-gateway 180.21.199.44","line vty 199\nip address 180.21.199.44"],{cli:1,mq:"איזה רצף יוצר ממשק וירטואלי (SVI) עם כתובת IP לניהול מרחוק של המתג?",n:"כדי שהחיבור מרחוק יעבוד בפועל צריך גם סיסמה על line vty 0 4 (שאלה 9)."}],
["p4",21,"הגדר כתובת DEFAULT GATEWAY על פורט 4 בנתב.","Router(config)#interface gigabitethernet 0/4\nRouter(config-if)#ip address 180.21.67.4 255.255.0.0\nRouter(config-if)#no shutdown\nכתובת זו של ממשק הנתב משמשת כ-Default Gateway של המחשבים ברשת. בחוברת הדוגמה היא על ממשק 0/5.",["interface gigabitethernet 0/4\nip address 180.21.67.4 255.255.0.0\nno shutdown","interface gigabitethernet 0/4\ndefault-gateway 180.21.67.4","ip route 0.0.0.0 gigabitethernet 0/4","interface gigabitethernet 0/4\nswitchport access vlan 4"],{cli:1,mq:"איזה רצף מגדיר על ממשק 0/4 בנתב כתובת שתשמש כ-Default Gateway לרשת?",n:"ב-Router> הפקודה configure terminal לא תעבוד — קודם enable. ובמתג (לא בנתב) מגדירים שער ברירת מחדל עם ip default-gateway."}]

B.push(
["t1",1,"מהו צב״ד מסוג LINK RUNNER?","צב״ד (ציוד בדיקה) ייעודי לניטור ומדידה: מדידה — בדיקת תקינות תוך כדי הפעלה שוטפת של ציוד התקשורת; ניטור — איסוף ורישום נתונים כדי לעקוב אחרי התקינות והרציפות של הרשת.",["ציוד בדיקה ייעודי לניטור ומדידה של תקינות הרשת","מתג רמה 3 נייד","תוכנה לניהול תקלות","כבל קונסול מיוחד"]],
["t1",2,"כיצד נבדוק מידע על המתג שאליו מתחברת נקודה שקופה בעזרת הצב״ד?","מחברים כבל RJ-45 מהחלק העליון של המכשיר לנקודה, בוחרים Switch ואז Select. במסך יתקבל מידע על המתג הקרוב — לרוב מיד, לפעמים עד כ-2 דקות, לפי הפרוטוקולים שמוגדרים במתג.",["מחברים RJ-45 לנקודה, בוחרים Switch ואז Select","מתחברים לקונסול המתג ומקלידים show version","מחברים את הצלצלן לנקודה ומאזינים לצליל","מבצעים ping לכתובת ה-Default Gateway"]],
["t1",3,"מהו פרוטוקול CDP? מה נעשה אם נרצה מידע על המתג ו-CDP לא מותקן עליו?","CDP — פרוטוקול קנייני של Cisco לגילוי שכנים ישירים, בשכבה 2; מעביר באופן מרוכז מידע על הציודים שהוא פועל עליהם. אם CDP לא מוגדר, בתפריט ה-Switch לא נראה כלום, ונצטרך להיכנס לתפריט Auto Test כדי למצוא את המידע.",["פרוטוקול של Cisco לגילוי שכנים ישירים; בלעדיו נשתמש בתפריט Auto Test","פרוטוקול לחלוקת כתובות; בלעדיו נגדיר IP ידנית","פרוטוקול הצפנה; בלעדיו נשתמש ב-SSH","פרוטוקול ניתוב; בלעדיו נגדיר ניתוב סטטי"],{v:[["באיזו שכבה פועל CDP?",["שכבה 2 — עורק","שכבה 3 — רשת","שכבה 4 — תעבורה","שכבה 7 — יישום"]]]}],
["t1",4,"מה ניתן לראות בתפריט ה-SWITCH בצב״ד?","סוג ושם המתג, כתובת ה-IP שלו, מספר הפורט שאליו מתחברים, מהירות ודופלקס, סוג החיבור (נחושת/סיב), ושיוך ה-VLAN.",["שם וסוג המתג, IP, מספר הפורט, מהירות ודופלקס ושיוך VLAN","רק את כתובת ה-MAC של המחשב","את רשימת המשתמשים בדומיין","את טבלת הניתוב של הנתב"]],
["t1",5,"אילו 3 דרכים יש לבדיקת כבל? פרט.","א. בדיקת כבל שאינו מחובר לכלום: מחברים RJ-45 בראש המכשיר ונכנסים ל-Cable Test (הבדיקה מתבצעת רק כשהקצה השני לא מחובר). ב. Wiremap — לכבלי נחושת בלבד: מחברים קצה אחד בראש המכשיר ואת הקצה השני בצד המכשיר (סגירת מעגל), ובודקים ב-Cable Test. ג. בדיקה עם הצלצלן — לבדיקת התאמה בין נקודה שקופה לנקודה ב-RIT.",["Cable Test לכבל לא מחובר, Wiremap, ובדיקה עם הצלצלן","Ping, Tracert ו-Ipconfig","בדיקה ויזואלית, מדידת אורך ושקילה","Show cdp, Show vlan ו-Show run"],{v:[["איזו בדיקת כבל אפשרית רק בכבל נחושת, כששני קצותיו מחוברים לצב״ד?",["Wiremap","Cable Test לכבל לא מחובר","בדיקת צלצלן","Auto Test"]]]}],
["t1",6,"מהו צלצלן? כיצד נשתמש בו ולאיזו מטרה?","רכיב שבודק התאמה בין נקודה שקופה (בקיר) לנקודה ב-RIT. מחברים את הצב״ד עם RJ-45 לנקודה השקופה, ועוברים עם הצלצלן על פורטי ה-RIT; בכל מעבר לוחצים Cable Test ובודקים אם יש קישור.",["רכיב שמוצא איזה פורט ב-RIT מתאים לנקודה שקופה מסוימת","רכיב שמשמיע התראה כשהמתג נופל","מכשיר לבדיקת מתח בשקע","תוכנה לניהול שיחות טלפון"]],
["t2",7,"מה נרשם בספר/בתוכנת הכלים בעת לקיחת ציוד?","איזה מכשיר נלקח (לפי מספר מקוטלג), מי לקח אותו (שם הטכנאי), ולשם איזו תקלה. בנוסף נרשמות בתוכנה/בספר 5 חתימות ביום על תקינות והימצאות כל הציוד בארון, למעט ציוד שמופיע כמושאל.",["איזה מכשיר (מספר מקוטלג), מי לקח, ולאיזו תקלה","רק שם הטכנאי","כתובת ה-IP של הציוד","מחיר הציוד ותאריך הרכישה"]],
["t2",8,"מהם 6 כללי הבטיחות בעבודה עם ארון ציוד?","1 אין להתקרב לארון התקשורת עם אוכל ושתייה. 2 אין לגעת בארון בידיים רטובות וברגליים חשופות. 3 אין להוציא מחברים שחוברו לפני שהגענו. 4 שומרים על כיפוף עדין של הכבל. 5 התחברות זהירה לציודים. 6 זהירות מיוחדת במקומות שאינם נראים לעין.",["אין לנתק מחברים שחוברו לפני שהגענו","מותר לשתות ליד הארון אם הבקבוק סגור","יש לכופף כבלים בזווית חדה כדי לחסוך מקום","מותר לעבוד יחפים כדי למנוע חשמל סטטי"],{mq:"איזה מהבאים הוא כלל בטיחות בעבודה עם ארון תקשורת?"}],
["t2",9,"מהי שיטת Patch Panel?","שיטת הסידור והתכנון של ארון התקשורת — כדי שנוכל לעבוד איתו בצורה הטובה והמסודרת ביותר.",["שיטת הסידור והתכנון של ארון התקשורת","שיטה לחלוקת כתובות IP","שיטה להצפנת טלפונים","שיטה לגיבוי שרתים"]],
["t2",10,"מהו RIT? מהו ODF?","RIT — פאנל מחברים של כבלי נחושת (RJ-45). ODF — פאנל מחברים של סיבים אופטיים.",["RIT — פאנל נחושת (RJ-45); ODF — פאנל סיבים אופטיים","RIT — פאנל סיבים; ODF — פאנל נחושת","RIT — מתג ראשי; ODF — מתג גיבוי","RIT — שרת; ODF — נתב"]],
["t2",11,"מהם 6 הנהלים למידור וסידור ארון תקשורת (על פי הסדר)?","1 עדכון המשתמשים המחוברים לארון שהשירות יושבת או יוגבל בזמן העבודה. 2 עבודה לפי מדרג (סיבים לפני RJ-45) לכל אורך העבודה. 3 מיפוי מלא ומפורט של הארון. 4 ניתוק לפי כללי הבטיחות. 5 בדיקת ההגדרות ותקינות המתג וכל הפורטים. 6 חיבור כל הקווים לפי הנהלים.",["עדכון המשתמשים שהשירות יושבת או יוגבל","ניתוק כל הכבלים","מיפוי מלא של הארון","חיבור כל הקווים לפי הנהלים"],{mq:"מהו הנוהל הראשון בסידור ארון תקשורת?",v:[["לפי הנהלים, באיזה מדרג עובדים בארון התקשורת?",["סיבים קודם, ואחריהם RJ-45","RJ-45 קודם, ואחריהם סיבים","קודם ספקי הכוח, ואחריהם הכבלים","אין מדרג — עובדים לפי סדר הפורטים"]]]}],
["t2",12,"מהם 7 הנהלים לסלילת מחברים בארון תקשורת?","1 כל מחבר עובר בפאנל ה״שערות״ שמתחתיו. 2 התאמה בין מיקום הנקודה ב-RIT לפורט במתג. 3 בדיקת שמישות הפורט והגדרותיו לפי הנדרש. 4 שימוש במחברים תקינים בלבד, באורך מתאים. 5 סלילת המחברים בצמוד לצידי הארון. 6 איזוק קבוצות מחברים יחד לחיסכון בנפח ולמניעת אי־סדר. 7 הדבקת שלפלפים בכל המקומות הנדרשים.",["סלילת המחברים בצמוד לצידי הארון ואיזוקם בקבוצות","מתיחת המחברים באלכסון במרכז הארון","שימוש בכבלים ארוכים ככל האפשר ליתר ביטחון","הסרת השלפלפים כדי למנוע בלבול"],{mq:"איזה מהבאים הוא נוהל נכון לסלילת מחברים בארון תקשורת?"}],
["t2",13,"מהם שלפלפים? מה נרשם בכל שלפלף ואיפה נמקם אותם?","מדבקות לבנות ליצירת סדר בארון התקשורת. על כל שלפלף רושמים: לאיזו רשת הכבל שייך, לאן הוא מגיע (כתובת IP של הציוד), באיזה מתג ופורט, ומהי נקודת ה-RIT. ממקמים ב-4 מקומות: בצד הכבל המתחבר למתג, בצד המתחבר ל-RIT, בצד המתחבר לנקודת הרשת, ובצד המתחבר למחשב.",["4 מקומות: צד המתג, צד ה-RIT, צד נקודת הרשת וצד המחשב","מקום אחד: על דלת הארון","2 מקומות: על המתג ועל המחשב","רק על כבלי הסיבים"],{mq:"בכמה ובאילו מקומות ממקמים שלפלפים על כבל?"}],
["t2",14,"כיצד מחממים נקודה?","חימום נקודה = הפיכת נקודת רשת לפעילה. 1 בדיקת קישוריות בנקודה; אם יש — מחברים את המכשיר. אם אין: 2 בדיקת צלצלן בין הנקודה השקופה למציאת הנקודה המקושרת ב-RIT. 3 בדיקת תקינות כבל RJ-45. 4 סלילה (לפי כללי הבטיחות והסלילה) בין נקודת ה-RIT לפורט במתג שהוגדר עבור הרכיב. 5 בדיקת קישוריות ותקינות החימום. 6 הדבקת שלפלפים.",["בודקים קישוריות, מוצאים את נקודת ה-RIT בצלצלן, ומחברים אותה בכבל תקין לפורט מוגדר במתג","מגדירים כתובת IP חדשה לנקודה","מחליפים את השקע בקיר","מפעילים את הנקודה דרך תוכנת מש״ל"],{mq:"מה המשמעות של ״חימום נקודה״ ואיך מבצעים אותו בעיקרון?"}],
["t3",15,"מהם הפרוטוקולים Telnet ו-SSH ומה ההבדל ביניהם?","שניהם משמשים להתחברות מרחוק לרכיב רשת. Telnet — לא מוצפן. SSH — מאובטח ומוצפן.",["שניהם לגישה מרחוק; SSH מוצפן ו-Telnet לא","Telnet מוצפן ו-SSH לא","Telnet להעברת קבצים ו-SSH לדוא״ל","SSH לגישה מקומית בלבד"]],
["t3",16,"מהי תוכנת מש״ל כחול?","התוכנה שבעזרתה הטכנאים מנהלים את התקלות. כשמתקבל דיווח על תקלה מזינים אותה מיד במערכת, כדי לעקוב אחרי התקלות ולשמור על סדר וארגון.",["תוכנה לניהול ומעקב אחר תקלות","תוכנה לניהול טלפוני ספיר","אנטי־וירוס ארגוני","תוכנה לשיחות וידאו"]],
["t3",17,"כיצד נפתח תקלה במש״ל כחול?","חדש ← תקלה חדשה.",["חדש ← תקלה חדשה","קובץ ← שמירה","כלים ← אפשרויות","עזרה ← דיווח"]],
["t4",18,"מהם שרתי CUCM, ומהו שירות CM?","CUCM (Cisco Unified Communications Manager) — השרת שרשת ״ספיר כחול״ מבוססת עליו. בכל שרת CUCM מלבד ה-Publisher רץ שירות Call Manager (CM) שמאפשר ניהול טלפוניית IP: הגדרות לטלפונים, טיפול בתקלות ובבקשות, הקמת שיחות ופונקציות ניהול.",["CUCM — שרתי הטלפוניה של רשת ספיר כחול; CM — השירות שמנהל את הטלפונים ומקים שיחות","CUCM — מתג ליבה; CM — פרוטוקול ניתוב","CUCM — אנטי־וירוס; CM — שרת ניהול שלו","CUCM — שרת דוא״ל; CM — שרת קבצים"]],
["t4",19,"היכן נמצאים שרתי ה-CUCM בחיל?","יש 9 שרתי CM בכל החיל: 5 בקריה ו-4 בצריפין.",["9 שרתים: 5 בקריה ו-4 בצריפין","9 שרתים: 4 בקריה ו-5 בצריפין","5 שרתים, כולם בקריה","שרת אחד בכל בסיס"]],
["t4",20,"מהו ה-PUBLISHER?","אחד מתשעת שרתי ה-CM, שתפקידו לבקר ולעדכן את כל שאר השרתים בכל שינוי ברשת ולוודא אחידות ביניהם. לכן בפועל 8 שרתי CM נמצאים בשימוש.",["השרת שמעדכן את כל שאר שרתי ה-CM ושומר על אחידות; לכן 8 בשימוש","השרת שמקים את כל השיחות","שרת הגיבוי שעולה רק כשכל השאר נופלים","שרת שמפרסם דפי אינטרנט"]],
["t4",21,"מהם שני ה-VLANים הייעודיים לטלפוני ספיר?","Voice VLAN 310 ו-311.",["310 ו-311","199 ו-200","1 ו-2","100 ו-101"]],
["t4",22,"מהו פרוטוקול VOIP?","Voice Over IP — טכנולוגיה להעברת קול על גבי רשתות IP. היתרון הגדול: חיסכון בפריסת תשתיות — אין צורך לפרוס קווי טלפון נפרדים, עובדים על רשת קיימת.",["העברת קול על גבי רשת IP, בלי צורך בקווי טלפון נפרדים","העברת קבצים בין שרתים","הצפנת תעבורת אינטרנט","חלוקת כתובות לטלפונים"]],
["t4",23,"מהו פרוטוקול RTP?","Real Time Transport Protocol — להעברת אותות קול ווידאו בזמן אמת. לפי החוברת נמצא בשכבת היישום ופועל מעל UDP (שכבת התעבורה).",["פרוטוקול להעברת קול ווידאו בזמן אמת, מעל UDP","פרוטוקול איתות להקמת שיחות","פרוטוקול לניתוב בין רשתות","פרוטוקול להעברת קבצים אמינה מעל TCP"],{v:[["מעל איזה פרוטוקול תעבורה פועל RTP?",["UDP","TCP","ICMP","ARP"]]]}],
["t4",24,"מהו פרוטוקול SIP?","Session Initiation Protocol — פרוטוקול איתות לשליטה וניהול של שיחות זמן אמת ברשתות IP. פועל בשכבת האפליקציה.",["פרוטוקול איתות לניהול שיחות זמן אמת ברשת IP","פרוטוקול להעברת השמע עצמו","פרוטוקול קנייני של Cisco לטלפונים","פרוטוקול לחלוקת כתובות IP"]],
["t4",25,"מהו פרוטוקול SCCP?","Skinny Call Control Protocol — פרוטוקול ייחודי (קנייני) של Cisco לתקשורת בין שרתי הטלפוניה (CUCM/CM) לבין טלפוני VoIP (ספיר כחול).",["פרוטוקול קנייני של Cisco בין שרתי CUCM לטלפוני VoIP","פרוטוקול פתוח להעברת וידאו","פרוטוקול לגילוי שכנים","פרוטוקול להצפנת דוא״ל"]],
["t4",26,"מהו תהליך ה-CERTIFICATE?","תהליך ההצפנה שהטלפון עובר לפני שימושו הראשון. אחרי קבלת ההגדרות ב-TFTP, הטלפון מקבל מה-CM מפתח הצפנה ייחודי; ה-CM מכיר את המפתחות של כל הטלפונים הרשומים אליו, ומידע ביניהם נשלח מוצפן. בסוף מוגדרים שפה, נראות, רישום ל-CM והצפנה. מתבצע במתג ייעודי של מחלקת אבנט בקריה.",["תהליך ההצפנה שהטלפון עובר לפני שימוש ראשון — קבלת מפתח הצפנה ייחודי מה-CM","תהליך חידוש כתובת ה-IP של הטלפון","תהליך רישום המשתמש לתוכנת ג׳אבר","בדיקת תקינות הכבל של הטלפון"]],
["t5",27,"כיצד נבצע שרשור?","שרשור = חיבור מחשב וטלפון ספיר על נקודת רשת אחת (חיסכון בפורטים). 1 כבל RJ-45 מהנקודה השקופה לפורט הייעודי בגב הספיר (מסומן SW או ציור מתג). 2 כבל RJ-45 מהמחשב לפורט הייעודי בגב הספיר (מסומן PC). 3 אם המתג תומך PoE — זה מספיק; אחרת מחברים שנאי לספיר. 4 מוודאים שהפורט במתג מוגדר עם VLAN (למחשב) ו-Voice VLAN.",["כבל מהנקודה לפורט SW בטלפון, וכבל מפורט PC בטלפון למחשב","כבל מהנקודה למחשב, וכבל מהמחשב לטלפון","שני כבלים מהנקודה — אחד לטלפון ואחד למחשב","חיבור הטלפון והמחשב למפצל USB"],{mq:"איך מחברים מחשב וטלפון ספיר לאותה נקודת רשת (שרשור)?"}],
["t5",28,"מה זה POE?","Power over Ethernet — יכולת של המתג להעביר מתח על גבי כבלי הנחושת (RJ-45), וכך מתבטל הצורך בכבלי מתח ושנאים.",["העברת מתח חשמלי על גבי כבל הרשת מהמתג","פרוטוקול להעברת וידאו","סוג של סיב אופטי","יחידת גיבוי למתח במקרה הפסקת חשמל"]],
["t5",29,"מהם 5 השלבים שמתבצעים בחיבור טלפון בפעם הראשונה?","א. חיבור למתח — אם המתג תומך PoE חיבור לנקודה מספיק, אחרת שנאי. ב. חיבור לרשת — חיבור פשוט לנקודה או שרשור עם מחשב. ג. קבלת נתוני רשת משרת DHCP (IP, Default Gateway, Subnet Mask). ד. טעינת הקונפיגורציה — במתג ייעודי להצפנה; רישום ל-CM לפי MAC; מפתחות הצפנה, שרתי CM, גרסה, שפה, Speed ו-Duplex. ה. כניסה לשירות — חשבון ופרופיל משלו; אם לא מוגדר Voice VLAN יופיע ״מבצע רישום״ ויש לפנות לתקשו״ב.",["מתח ← חיבור לרשת ← קבלת כתובות מ-DHCP ← טעינת קונפיגורציה ← כניסה לשירות","חיבור לרשת ← כניסה לשירות ← מתח ← DHCP ← קונפיגורציה","קונפיגורציה ← מתח ← DHCP ← חיבור לרשת ← כניסה לשירות","DHCP ← מתח ← כניסה לשירות ← קונפיגורציה ← חיבור לרשת"],{mq:"מהו הסדר הנכון של השלבים בחיבור טלפון ספיר בפעם הראשונה?",v:[["טלפון ספיר מציג ״מבצע רישום״ ולא מתחבר. מה הסיבה הסבירה לפי החומר?",["לא הוגדר לו Voice VLAN בפורט","הכבל ארוך מדי","השרת DNS לא זמין","מסך הטלפון שבור"]]]}],
["t5",30,"כיצד מתבצע תהליך הקמת השיחה?","1 טלפון A רשום ב-CM. 2 טלפון A שולח ל-CM בקשת Setup, וה-CM מחזיר Ack. 3 ה-CM בודק את תקינות הטלפון, יכולות החיוג, ההצפנה והמספר; אם הכל תקין שולח צלצול לטלפון B ובודק את מצבו (בשיחה, מנותק, מקבל, תפוס) ומחזיר ל-A צלצול חוזר. 4 אחרי החיבור הראשוני, השיחה מתנהלת בפרוטוקול RTP. 5 מעתה, גם אם ה-CM נופל — השיחה ממשיכה על גבי ה-RTP.",["השיחה ממשיכה, כי אחרי ההקמה היא עוברת ב-RTP","השיחה מתנתקת מיד","השיחה עוברת לקו אנלוגי","השיחה ממשיכה רק אם יש SRST"],{mq:"מה קורה לשיחה שכבר הוקמה אם שרת ה-CM נופל באמצעה?",v:[["מה הצעד הראשון שטלפון A מבצע כדי להקים שיחה, אחרי שהוא רשום ב-CM?",["שולח ל-CM בקשת Setup","שולח RTP ישירות לטלפון B","שולח ARP לטלפון B","מבקש כתובת מ-DHCP"]]]}],
["t5",31,"מהו נתב ה-SRST?","נתב שמשמש גיבוי ל-Call Manager ברמת הבסיס — מעין CM בגרסה מצומצמת. נכנס לפעולה כשנופלים הקישורים לכל שרתי ה-CM. אין עדיפות למכשירים — ״הקודם זוכה״: עד 1000 טלפונים, הראשונים שעלו. שיחות בתוך הבסיס ללא הגבלה, ושיחות בין־בסיסיות עד 30 בו־זמנית.",["גיבוי ל-CM ברמת הבסיס — עד 1000 טלפונים ו-30 שיחות בין־בסיסיות","השרת הראשי של כל שרתי ה-CM","נתב שמצפין טלפונים חדשים","נתב שמחבר בין טלפון אנלוגי לרשת IP"],{v:[["כמה טלפונים יכול לשרת נתב SRST, וכיצד נקבע מי מהם יעבוד?",["עד 1000 — הראשונים שעלו (״הקודם זוכה״)","עד 30 — לפי דרגה","ללא הגבלה","עד 100 — לפי מספר השלוחה"]]]}],
["t6",32,"מהו VC ואילו 2 סוגי VC קיימים בחיל?","VC (Video Camera) — רכיב שתומך בשיחות וידאו, עובד על רשת שביל החלב (כמו ספיר כחול). סוגים: VC אישי — לדיונים אישיים (1:1); VC חד״ן — לוועידה רבת משתתפים.",["רכיב לשיחות וידאו; VC אישי ו-VC חד״ן","מצלמת אבטחה; פנימית וחיצונית","כרטיס מסך; אנלוגי ודיגיטלי","תוכנת צ׳אט; קולי וכתוב"]],
["t6",33,"מהו CISCO JABBER?","אפליקציה של Cisco שמקשרת בין המחשב לטלפון הספיר: שיחות, צ׳אט, מענה וניתוק מהמחשב, שיתוף מסך, פתיחת חלון VC אוטומטי, שליחת קבצים, סנכרון עם Outlook ועוד.",["אפליקציה שמקשרת בין המחשב לטלפון הספיר","אנטי־וירוס של Cisco","נתב גיבוי לטלפוניה","תוכנה לניהול תקלות"]],
["t6",34,"מהו CISCO WEBEX?","אפליקציה של Cisco לשיחות וידאו רבות משתתפים, עם שיתוף מסך ומצגות, ציור בזמן אמת ושליחת קבצים; שימשה להדרכה מרחוק. לפי החוברת היא הורדה ואינה בשימוש בחיל.",["אפליקציה לשיחות וידאו רבות משתתפים — הורדה ואינה בשימוש בחיל","אפליקציה לשינוי הגדרות בטלפוני ספיר","שרת הטלפוניה הראשי","ממשק בין טלפון אנלוגי לרשת"]],
["t6",35,"מהי אפליקציית NOC?","אפליקציה לשינוי הגדרות בסיסיות בטלפוני הספיר, שפותחה עבור גפי התקשוב בבסיסים: שינוי שם, הוספת קיצורים, שיוך VC ועוד.",["אפליקציה לשינוי הגדרות בסיסיות בטלפוני הספיר עבור גפי התקשוב","מוקד ניהול רשת ארצי","אפליקציה לשיחות וידאו","אנטי־וירוס לטלפונים"]],
["t6",36,"כיצד נשייך VC לעמדה?","1 שיוך ה-VC לטלפון. 2 שיוך הטלפון ליוזר. 3 יציאה וכניסה מחדש לתוכנת הג׳אבר במחשב.",["משייכים VC לטלפון, את הטלפון ליוזר, ויוצאים ונכנסים לג׳אבר","מחברים את ה-VC ישירות למתג ומגדירים לו IP","מתקינים דרייבר ב-Device Manager","פותחים תקלה במש״ל כחול"]],
["t6",37,"מהו VG (VOICE GATEWAY) וכיצד הוא בנוי?","רכיב שמקשר בין מרכזיית טלפוניה מבוססת IP לבין ציוד קצה שאינו עובד ב-IP — למשל טלפון אנלוגי — וממיר את המידע ביניהם כדי שיוכלו לדבר למרות פערי הטכנולוגיה.",["רכיב שמחבר טלפון אנלוגי למרכזייה מבוססת IP וממיר ביניהם","נתב גיבוי ל-Call Manager","אפליקציה לשיחות וידאו","מתג עם PoE"]]
);
