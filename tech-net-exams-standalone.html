B.push(
["m1",1,"מהן התכונות הנדרשות ממחשב?","פעולה אוטומטית (פיקוח אנושי מינימלי), מהירות בטיפול במידע, רמת דיוק גבוהה, ביצוע פעולות לוגיות על כמות עצומה של נתונים, ומהימנות (אחוז תקלות אפסי).",["פעולה אוטומטית, מהירות, דיוק, פעולות לוגיות על הרבה נתונים ומהימנות","מסך גדול, מקלדת נוחה ועכבר אלחוטי","חיבור לאינטרנט, אנטי־וירוס ומדפסת","משקל נמוך, סוללה ומצלמה"]],
["m1",2,"מהן היחידות שמחשב חייב להכיל?","יחידות קלט/פלט — להכנסת נתונים ולצפייה בתוצאות; יחידות זיכרון — אגירת נתונים; יחידת בקרה — ״המוח״ שמקשר בין חלקי המערכת; יחידה אריתמטית־לוגית (ALU) — ביצוע החישובים.",["קלט/פלט, זיכרון, יחידת בקרה ויחידה אריתמטית־לוגית (ALU)","מסך, מקלדת, עכבר ורמקולים","כרטיס רשת, כרטיס מסך וכרטיס קול","מעבד, מדפסת, סורק וכונן"]],
["m1",3,"מהו לוח האם ומה תפקידו?","הלוח הראשי במחשב (Mother Board) — לב המערכת. כל רכיב במחשב חייב להיות מחובר או מקושר אליו. מבוסס על ערכת שבבים (Chipset) שמגשרת בין רכיבי המחשב, ומכיל רכיבי אלקטרוניקה נוספים.",["הלוח הראשי שכל הרכיבים מחוברים אליו, עם ערכת שבבים שמגשרת ביניהם","כרטיס הרחבה לגרפיקה","הזיכרון הקבוע של המחשב","ספק הכוח של המחשב"]],
["m1",4,"מהם 3 אפיקי הנתונים (BUS) על לוח האם?","Data Bus — אפיק הנתונים, מעביר את המידע; Address Bus — אפיק הכתובות, קובע לאן המידע נשלח; Control Bus — אפיק הבקרה, מתזמן את העברת המידע.",["Data, Address ו-Control","PCI, PCIe ו-AGP","USB, SATA ו-HDMI","Input, Output ו-Storage"],{v:[["מה תפקידו של ה-Address Bus?",["לקבוע לאן המידע צריך להישלח","להעביר את המידע עצמו","לתזמן את העברת המידע","לספק מתח לרכיבים"]]]}],
["m2",5,"מהם כרטיסי הרחבה?","רכיבי חומרה שמתחברים ללוח האם ומאפשרים למחשב לבצע פעולות שלא תוכנן לבצע קודם, או מייעלים פעולות קיימות — למשל כרטיס קול, כרטיס רשת, כרטיס מסך.",["רכיבים שמתחברים ללוח האם ומוסיפים יכולות — קול, רשת, מסך","תוכנות שמרחיבות את מערכת ההפעלה","כבלים מאריכים לציוד היקפי","דיסקים חיצוניים"]],
["m2",6,"מהם PCI ו-PCIE ומה ההבדל ביניהם?","PCI (Peripheral Component Interconnect) — תקן אפיק להוספת התקנים ללוח האם, פותח ע״י Intel. PCIe — שיפור של PCI שעובד מהר יותר (E = Express).",["שניהם תקני חריצי הרחבה; PCIe הוא גרסה מהירה יותר (Express)","PCI לזיכרון ו-PCIe למעבד","PCI חיצוני ו-PCIe פנימי","PCIe ישן ואיטי יותר מ-PCI"]],
["m2",7,"מהו כרטיס רשת?","היחידה שמקשרת את המחשב לרשת — שער הגישה של המחשב לרשת. צרובה עליו כתובת ייחודית שאינה ניתנת לשינוי: כתובת MAC.",["היחידה שמחברת את המחשב לרשת, ועליה צרובה כתובת MAC","היחידה שמציגה תמונה על המסך","תוכנה לגלישה באינטרנט","כרטיס זיכרון לשמירת הגדרות רשת"]],
["m2",8,"מהו כרטיס מסך?","הרכיב שאחראי על הצגת הפלט החזותי על המסך: לוקח את פלט המחשב ומורה למסך אילו פיקסלים להאיר ובאיזה צבע.",["הרכיב שמורה למסך אילו פיקסלים להאיר ובאיזה צבע","המסך עצמו","כבל ה-HDMI","תוכנת שומר המסך"]],
["m3",9,"מהו המעבד?","רכיב החומרה שמבצע את הפקודות המאוחסנות בזיכרון; אחראי על עיבוד הנתונים והפקת המידע — ״המוח״ של המחשב.",["הרכיב שמבצע את הפקודות ומעבד את הנתונים — המוח של המחשב","הרכיב ששומר קבצים לאורך זמן","הרכיב שמציג תמונה","הרכיב שמספק חשמל"]],
["m3",10,"מהו ה-CLOCK במעבד?","שעון שמייצר פולסים (דפקים) שקובעים את קצב פעולת המעבד והרכיבים, את קצב העברת הנתונים ועוד.",["שעון שמייצר פולסים שקובעים את קצב פעולת המעבד","השעון שמציג את השעה במערכת ההפעלה","סוללת ה-CMOS","מונה שמודד כמה זמן המחשב דולק"]],
["m3",11,"מהו ה-PGA?","Pin Grid Array — מארז של שבב (מעבד) בצורת ריבוע עם מערך גדול של פינים (רגליים); תצורה נפוצה של מעבדים, שמחברת בין המעבד ללוח האם.",["מארז מעבד עם מערך פינים שמתחבר ללוח האם","סוג של זיכרון RAM","כרטיס גרפי","ממשק לחיבור דיסקים"],{n:"בחוברת ה-PGA מתואר גם כ״רכיב שעליו מתקינים את המעבד״. מדויק יותר: PGA הוא סוג המארז (הפינים על המעבד), והוא נכנס לשקע (Socket) תואם בלוח האם."}],
["m3",12,"מהו מעבד Multi-Core?","מעבד מרובה ליבות: משלב שתי ליבות עצמאיות או יותר בתוך מארז אחד, כדי להשיג ביצועים גבוהים יותר. ככל שיש יותר ליבות — המעבד חזק יותר.",["מעבד עם שתי ליבות עצמאיות או יותר במארז אחד","שני מעבדים נפרדים על לוח האם","מעבד עם שעון כפול","מעבד שעובד גם כמעבד גרפי"]],
["m3",13,"מהי טכנולוגיית Hyper-Threading?","טכנולוגיה שמפצלת תהליכים לתהליכונים (Threads) קטנים יותר, כך שהמעבד מבצע ריבוי משימות — ״כאילו״ יש שני מעבדים שעובדים במקביל, למרות שבפועל יש אחד.",["פיצול לתהליכונים כך שליבה אחת מתנהגת ״כאילו״ היא שתיים","הוספת ליבות פיזיות למעבד","האצת שעון המעבד מעבר למהירות המקורית","קירור המעבד באמצעות מאוורר כפול"],{v:[["מה ההבדל בין Multi-Core ל-Hyper-Threading?",["Multi-Core — כמה ליבות פיזיות; Hyper-Threading — ליבה אחת שמריצה שני תהליכונים","אין הבדל","Hyper-Threading מוסיף ליבות פיזיות","Multi-Core הוא שם ישן ל-Hyper-Threading"]]]}],
["m3",14,"לפי אילו 2 מאפיינים עיקריים ניתן להבדיל בין מעבדים?","מהירות — נמדדת ב-MHz או ב-GHz (מיליוני/מיליארדי תנודות בשנייה). רוחב אפיק נתונים — כמות הנתונים שהמעבד מעבד בו־זמנית (32 ביט או 64 ביט).",["מהירות (GHz) ורוחב אפיק הנתונים (32/64 ביט)","צבע וגודל","מחיר ויצרן","מספר יציאות USB ונפח דיסק"]],
["m3",15,"מהו מעבד 32bit? מהו מעבד 64bit?","המונחים מתארים את צורת העבודה של המעבד: מעבד 64 ביט יכול להשתמש בו־זמנית ב-64 סיביות נתונים בזיכרון, לעומת מעבד 32 ביט שמשתמש רק ב-32 סיביות בו־זמנית.",["כמות הסיביות שהמעבד מעבד בו־זמנית","מספר הליבות במעבד","מהירות השעון במגה־הרץ","גודל זיכרון המטמון"],{mq:"מה מציין המונח 32bit או 64bit במעבד?"}],
["m3",16,"האם מעבד 64bit יכול לעבוד עם תוכנות בתצורת 32bit? האם יכול להיות ההפך?","כן — מעבד 64 ביט מריץ תוכנות של 64 ביט ומטה (כולל 32 ביט). ההפך: לפי החוברת מעבד 32 ביט יריץ חלק מתוכנות ה-64 ביט ובצורה לא מלאה.",["מעבד 64 ביט מריץ גם תוכנות 32 ביט","מעבד 64 ביט מריץ רק תוכנות 64 ביט","מעבד 32 ביט מריץ את כל תוכנות ה-64 ביט במלואן","אין שום תאימות בין 32 ל-64 ביט"],{mq:"מה נכון לגבי תאימות בין מעבדים לתוכנות?",n:"בחוברת כתוב שמעבד 32 ביט יכול להריץ חלק מתוכנות ה-64 ביט. בפועל מעבד 32 ביט אינו יכול להריץ קוד 64 ביט כלל. הכיוון ההפוך (64 מריץ 32) נכון."}],
["m4",17,"מהו זיכרון נדיף? מהו זיכרון בלתי נדיף?","נדיף — זקוק לאספקת חשמל רציפה כדי שהמידע לא יימחק (״זיכרון זמני״), ויתרונו מהירות. בלתי נדיף — שומר את המידע גם ללא חשמל (״זיכרון קבוע״).",["נדיף נמחק בלי חשמל (כמו RAM); בלתי נדיף נשמר גם בלי חשמל (כמו ROM)","נדיף נשמר בלי חשמל; בלתי נדיף נמחק","נדיף הוא זיכרון חיצוני; בלתי נדיף פנימי","נדיף איטי; בלתי נדיף מהיר תמיד"],{v:[["איזה מהבאים הוא זיכרון נדיף?",["RAM","ROM","Flash","HDD"]]]}],
["m4",18,"מהו זיכרון מסוג ROM?","זיכרון בלתי נדיף שמתוכנת ע״י היצרן; הנתונים נצרבים בו לקריאה בלבד. בדרך כלל שומרים בו את תוכנת האתחול (Boot) ואת ה-BIOS. כיום משתמשים בעיקר בגרסאות משופרות שניתנות לשינוי: PROM, EPROM, EEPROM.",["זיכרון בלתי נדיף לקריאה בלבד שנצרב ע״י היצרן — למשל BIOS","זיכרון נדיף לקריאה וכתיבה","זיכרון מטמון בתוך המעבד","דיסק קשיח מהיר"]],
["m4",19,"מהו זיכרון הבזק (FLASH)?","זיכרון בלתי נדיף שמאפשר כתיבה, מחיקה וכתיבה חוזרת. נפוץ במצלמות דיגיטליות, נגני MP3 ודיסק און קי, בזכות שמירת המידע ללא חשמל וגודל קטן ביחס לנפח.",["זיכרון בלתי נדיף שאפשר לכתוב, למחוק ולכתוב שוב — כמו דיסק און קי","זיכרון נדיף מהיר","זיכרון לקריאה בלבד","זיכרון וירטואלי בדיסק"]],
["m4",20,"מהו זיכרון RAM?","Random Access Memory — זיכרון נדיף לקריאה וכתיבה, לאחסון זמני של מה שרץ במחשב בזמן אמת. יתרון: זמן תגובה בננו־שניות. חיסרון: כל הפסקת מתח מוחקת את המידע.",["זיכרון נדיף ומהיר לאחסון זמני של מה שרץ כרגע","זיכרון קבוע לשמירת קבצים","זיכרון לקריאה בלבד","זיכרון על כרטיס המסך בלבד"]],
["m4",21,"מהו DDR SDRAM?","Double Data Rate — זיכרון RAM משופר ומהיר יותר (מעביר נתונים פעמיים בכל מחזור שעון); הנפוץ ביותר כיום. גרסאות DDR1 עד DDR5; כל דור מכפיל את הקצב. יש הבדל פיזי — מיקום החריץ בכל דור שונה, כך שכל DDR מתאים רק ללוח אם שתומך בו.",["זיכרון RAM מהיר; לכל דור (DDR1–DDR5) חריץ שונה ואין תאימות בין דורות","סוג של דיסק קשיח","זיכרון ROM שניתן לצריבה","סוג של כרטיס מסך"],{v:[["האם אפשר להכניס זיכרון DDR4 ללוח אם שתומך רק ב-DDR3?",["לא — החריץ ממוקם אחרת בכל דור","כן — כל הדורות תואמים","כן, אבל במהירות נמוכה","רק אם מעדכנים את ה-BIOS"]]]}],
["m4",22,"כיצד נחליף או נתקין התקן במחשב?","1 ניתוק כבל המתח ופריקת המתח. 2 פתיחת מכסה המחשב. 3 בדיקה שההתקן מתאים לחומרה (למשל DDR מתאים ללוח האם). 4 חיבור ההתקן במקום המתאים (כרטיסי הרחבה בחריצי PCI/PCIe, זיכרון בחריצי ה-RAM). 5 הפעלה מחדש ובדיקה שההתקן נקלט.",["לנתק מתח ולפרוק אותו","לפתוח את המכסה","להכניס את ההתקן לחריץ","להדליק את המחשב"],{mq:"מהו הצעד הראשון בהתקנת רכיב חומרה בתוך המחשב?"}],
["m4",23,"מהו זיכרון מטמון (CACHE)?","זיכרון נדיף קטן ומהיר (מאות KB עד כמה MB) שנמצא בין המעבד ליחידות האחסון, ושומר מידע שחוזרים אליו — כך חוסכים חישובים ושליפות מהמקור האיטי.",["זיכרון קטן ומהיר בין המעבד לזיכרון הראשי, לשליפה מהירה של מידע חוזר","זיכרון קבוע לשמירת BIOS","שטח בדיסק שמשמש כ-RAM","תיקיית קבצים זמניים של הדפדפן בלבד"]],
["m4",24,"מהו זיכרון וירטואלי?","טכניקה לניהול זיכרון: כשה-RAM מתמלא, מערכת ההפעלה מעבירה בלוקים של מידע לשטח בדיסק ומשתמשת בו כהרחבה של ה-RAM. זה לא פתרון מושלם, כי הדיסק איטי בהרבה מה-RAM.",["שימוש בשטח בדיסק כהרחבה ל-RAM כשהוא מתמלא","זיכרון RAM של מכונה וירטואלית","זיכרון מטמון בתוך המעבד","זיכרון בענן"],{n:"בחוברת כתוב שהמערכת משתמשת ״בזיכרון ה-ROM״. הכוונה בפועל לדיסק (קובץ ההחלפה, Page File). ROM הוא לקריאה בלבד ואי אפשר לכתוב אליו."}],
["m5",25,"מהו HDD?","Hard Disk Drive — רכיב בלתי נדיף לשמירה ואחסון אמין של נתונים בנפח גדול; זמן הגישה איטי יחסית ל-RAM. מערכת ההפעלה מנהלת אותו בעזרת מערכת קבצים. בא בשתי תצורות: פנימי (בתוך המחשב) וחיצוני (מתחבר בכבל).",["דיסק קשיח — אחסון בלתי נדיף בנפח גדול, איטי יחסית ל-RAM","זיכרון נדיף מהיר","כרטיס מסך","זיכרון לקריאה בלבד"]],
["m5",26,"מהו SSD?","Solid State Drive — כונן אחסון בנוי כמעגל מודפס, ללא חלקים מכניים; לכן מהיר, חסכוני, שקט ועמיד. החיסרון: המחיר.",["כונן ללא חלקים מכניים — מהיר, שקט ועמיד, אך יקר","דיסק עם פלטות מסתובבות","זיכרון נדיף","כונן תקליטורים"],{v:[["מהו החיסרון העיקרי של SSD לעומת HDD, לפי החומר?",["המחיר","האיטיות","הרעש","הרגישות לזעזועים"]]],n:"בחוברת כתוב שה-SSD הוא התקדמות של זיכרון ROM. מדויק יותר: SSD מבוסס על זיכרון הבזק (Flash)."}],
["m6",27,"מהם אמצעי קלט/פלט?","אמצעי I/O. קלט — אמצעים שבעזרתם המחשב קולט נתונים: מקלדת, עכבר, סורק. פלט — אמצעים שבעזרתם המחשב מציג נתונים: מסך, מדפסת, רמקולים.",["קלט: מקלדת, עכבר, סורק; פלט: מסך, מדפסת, רמקולים","קלט: מסך, מדפסת; פלט: מקלדת, עכבר","קלט: RAM; פלט: ROM","קלט: מעבד; פלט: לוח אם"],{v:[["איזה מהבאים הוא אמצעי קלט?",["סורק","מדפסת","רמקולים","מסך"]]]}],
["m6",28,"מהו ממשק PS2?","ממשק ישן יחסית לחיבור מקלדת ועכבר, שפחות בשימוש מאז ה-USB. ירוק — לעכבר; סגול — למקלדת.",["ממשק ישן למקלדת (סגול) ולעכבר (ירוק)","ממשק תצוגה דיגיטלי","ממשק לחיבור דיסקים","ממשק רשת"]],
["m6",29,"מהו ממשק USB?","תקן לחיבור מחשבים לציוד היקפי, החלופה התקנית והפופולרית ביותר לחיבור חומרה. עם השנים נוצרו סוגים שונים, כמו USB Micro ו-Type C.",["תקן נפוץ לחיבור ציוד היקפי, עם סוגים כמו Micro ו-Type C","ממשק תצוגה אנלוגי","ממשק לדיסקים בשרתים בלבד","פרוטוקול רשת"]],
["m6",30,"מהם ממשקי VGA ו-DVI ואילו 3 סוגי DVI קיימים?","ממשקי תצוגה בין כרטיס המסך למסך. VGA — נפוץ, אנלוגי, תמונה בלבד, 15 פינים (DB15). DVI — מתקדם יותר, בדרך כלל תמונה בלי קול. DVI-A — אות וידאו אנלוגי (ניתן להתאים ל-VGA); DVI-D — דיגיטלי; DVI-I — גם אנלוגי וגם דיגיטלי באותו מחבר.",["DVI-A אנלוגי, DVI-D דיגיטלי, DVI-I גם וגם","DVI-1, DVI-2, DVI-3 לפי מהירות","DVI-S, DVI-M, DVI-L לפי גודל","DVI-V לווידאו, DVI-A לשמע, DVI-D לנתונים"],{mq:"מהם שלושת סוגי ה-DVI?",v:[["מה נכון לגבי ממשק VGA?",["אנלוגי, מעביר תמונה בלבד, 15 פינים","דיגיטלי, מעביר תמונה ושמע","דיגיטלי, 19 פינים","ממשק לחיבור מקלדת"]]]}],
["m6",31,"מהו ממשק HDMI?","מהממשקים הנפוצים כיום; מעביר שמע ווידאו, ובו אפשר להעביר וידאו ברזולוציה גבוהה מאוד.",["ממשק דיגיטלי נפוץ שמעביר וידאו ושמע ברזולוציה גבוהה","ממשק אנלוגי לתמונה בלבד","ממשק לחיבור מדפסות","ממשק לחיבור דיסקים"]],
["m6",32,"מהו ממשק SCSI? מהו ממשק SAS?","SCSI (Small Computer System Interface) — תקן להעברת נתונים בצורה מקבילית בקצב גבוה, בעיקר לחיבור שרתים להתקני אחסון. SAS (Serial Attached SCSI) — מחליף את SCSI הישן (טורי).",["SCSI — מקבילי, לחיבור שרתים לאחסון; SAS — הגרסה הטורית שמחליפה אותו","SCSI — ממשק תצוגה; SAS — ממשק שמע","SCSI — כבל רשת; SAS — כבל קונסול","SCSI — לעכבר; SAS — למקלדת"]],
["m6",33,"מהו ממשק SATA?","Serial Advanced Technology Attachment — תקן טורי להעברת נתונים בין המחשב לאמצעי אחסון (דיסק קשיח, כונן DVD). מהירויות 1.5/3/6 Gb/s; בניגוד ל-SCSI, כבל דק וגמיש, ומשמש במחשבים אישיים. מספק אמינות ושלמות נתונים גבוהות.",["תקן טורי לחיבור דיסקים וכוננים במחשבים אישיים","תקן מקבילי לחיבור מדפסות","ממשק תצוגה","ממשק לחיבור מקלדת ועכבר"]],
["m7",34,"מהי תוכנת ה-BIOS? כיצד נפתח אותה?","תוכנה צרובה על רכיב ROM בלוח האם, שמכילה את הגדרות הבסיס של המערכת; בלעדיה המחשב לא יכול לעבוד. פתיחה: מדליקים/מאתחלים, ובזמן שהמסך ריק לוחצים על מקש הכניסה (בחוברת F10; תלוי ביצרן — לעיתים Del או F2), ואז נכנסים לכרטיסייה הרלוונטית.",["מדליקים את המחשב ולוחצים על מקש ייעודי (בחוברת F10) לפני עליית מערכת ההפעלה","נכנסים ל-Control Panel ובוחרים BIOS","מקלידים bios ב-CMD","פותחים את מנהל ההתקנים"],{mq:"איך נכנסים להגדרות ה-BIOS?"}],
["m7",35,"מהם התפקידים העיקריים של ה-BIOS?","1 זיהוי רכיבי החומרה — כל התקן חייב להזדהות דרכו. 2 קביעת הגדרות חומרה בסיסיות והפעלה או כיבוי של התקנים. 3 קביעת סדר התקני האחסון — באיזה התקן לחפש את מערכת ההפעלה (Boot Order). 4 הרצת פונקציות שפועלות גם כשהמחשב כבוי — שעון ותאריך.",["קביעת סדר האתחול (באיזה התקן לחפש את מערכת ההפעלה)","התקנת תוכנות Office","סריקת וירוסים","ניהול משתמשים בדומיין"],{mq:"איזה מהבאים הוא תפקיד של ה-BIOS?"}],
["m7",36,"מהי בדיקת POST?","Power On Self Test — בדיקה שה-BIOS מבצע מיד עם ההדלקה, כדי לבדוק אם יש בעיות חומרה. רק אחרי שהבדיקה מסתיימת המחשב מחפש את מערכת ההפעלה וטוען אותה. תקלה מדווחת בהודעת שגיאה, בצפצופים או בנורה מהבהבת. לפי החוברת אפשר להפעיל אותה ביוזמה בלחיצה על F2 בזמן העלייה.",["בדיקה עצמית של החומרה מיד בהדלקה, לפני טעינת מערכת ההפעלה","סריקת וירוסים בהדלקה","בדיקת חיבור לאינטרנט","גיבוי אוטומטי של הקבצים"],{v:[["כיצד ידווח מחשב על תקלה שנמצאה בבדיקת POST?",["בהודעת שגיאה, בצפצופים או בנורה מהבהבת","בהודעת דוא״ל למנהל הרשת","ביומן אירועים בלבד","הוא לא מדווח — רק לא נדלק"]]]}],
["m7",37,"מהו שבב ה-CMOS? מהי סוללת ה-CMOS?","שבב על לוח האם שמאחסן את כל הגדרות ה-BIOS. סוללת ליתיום (סוללת CMOS) מספקת לו זרם כך שגם כשהמחשב כבוי ההגדרות נשמרות. אם מוציאים את הסוללה — ההגדרות חוזרות לברירת המחדל.",["שבב ששומר את הגדרות ה-BIOS, וסוללה ששומרת עליהן כשהמחשב כבוי","זיכרון RAM נוסף וסוללת גיבוי למחשב נייד","מעבד עזר וסוללה לשעון בלבד","כרטיס רשת וסוללה למודם"]],
["m7",38,"ציין 3 דרכים לאיפוס הגדרות ה-BIOS להגדרות היצרן.","1 הדרך הפשוטה: כניסה ל-BIOS ובחירה ב-Load Setup Defaults (השם משתנה בין מחשבים). 2 הוצאת סוללת ה-CMOS ל-30 שניות. 3 איפוס בעזרת המגשר (ג׳אמפר) ליד הסוללה — הוצאתו פותחת מעגל ומאפסת. לפעמים יש גם כפתור ייעודי ליד הסוללה.",["Load Setup Defaults, הוצאת סוללת CMOS ל-30 שניות, וג׳אמפר","פרמוט הדיסק, החלפת מעבד והתקנה מחדש","כיבוי והדלקה, עדכון Windows ומחיקת קבצים זמניים","ניתוק כבל רשת, החלפת מסך וניקוי מאוורר"]],
["m8",39,"מהו כבל DP?","DisplayPort — חיבור דיגיטלי מתקדם עם ביצועים גבוהים, זול יותר מ-HDMI, שיכול להתחבר (במתאם) לטכנולוגיות קודמות כמו VGA ו-DVI. מעביר וידאו ואודיו באיכות גבוהה וגם ערוץ תקשורת נוסף בין התקנים.",["DisplayPort — חיבור תצוגה דיגיטלי שמעביר וידאו ואודיו","Data Port — כבל רשת מהיר","Disk Port — חיבור לדיסק קשיח","Dual Power — כבל חשמל כפול"]],
["m8",40,"מהו KVM?","Keyboard Video Mouse — רכיב שמחבר כמה מחשבים/שרתים למקלדת, מסך ועכבר מרכזיים אחד, ומאפשר לעבור ביניהם בלחיצת כפתור או בקיצור מקשים. המחשבים מתחברים אליו בכבלי תצוגה (VGA, HDMI, DP).",["רכיב שמאפשר לשלוט בכמה מחשבים ממקלדת, מסך ועכבר אחד","מתג רשת לשרתים","סוג של כרטיס מסך","מערכת הפעלה לשרתים"]],
["m8",41,"מהו פיקסל?","נקודת צבע; מיליוני נקודות כאלה יוצרות את התמונה על המסך. בכל פיקסל משלבים 3 צבעים, לכל אחד 256 רמות עוצמה — וכך מתקבלים יותר מ-16 מיליון צבעים.",["נקודת צבע בתמונה — 3 צבעים × 256 רמות = יותר מ-16 מיליון צבעים","יחידת מדידה של מהירות מעבד","כבל תצוגה","יחידת זיכרון של כרטיס המסך"]],
["m8",42,"מהי רזולוציה?","מידת החדות ורמת הפירוט של התמונה, הנמדדת במספר הפיקסלים שמרכיבים את התמונה השלמה.",["מספר הפיקסלים שמרכיבים את התמונה — קובע חדות ופירוט","קצב רענון המסך","גודל המסך באינצ׳ים","בהירות המסך"]],
["m8",43,"מהו פרוטוקול EDID?","Extended Display Identification Data — תקשורת בין המקור (המחשב) ליעד (המסך): המסך מדווח למחשב על יכולותיו, כמו הרזולוציה, והמחשב מתאים את עצמו אוטומטית. עם כמה מסכים — כל מסך נשאל בנפרד.",["המסך מדווח למחשב על הרזולוציה שלו, והמחשב מתאים את עצמו","פרוטוקול להצפנת תמונה","דרייבר של כרטיס המסך","פרוטוקול לחיבור מקלדת"]],
["m9",44,"מהי מדפסת הזרקת דיו ומהי מדפסת לייזר?","הזרקת דיו — מתיזה דיו נוזלי על הדף, באיכות גבוהה. לייזר — מדפיסה באבקת טונר בעזרת קרן לייזר. בחיל משתמשים במדפסות לייזר בלבד.",["דיו — מתיזה דיו נוזלי; לייזר — אבקת טונר וקרן לייזר. בחיל: לייזר בלבד","דיו — אבקה; לייזר — דיו נוזלי","שתיהן משתמשות בדיו נוזלי","בחיל משתמשים בהזרקת דיו בלבד"]],
["m9",45,"מהם 4 הרכיבים העיקריים במדפסת (פרט לפי סדר פעולת ההדפסה)?","1 מגירת דפים (Tray) — מחזיקה את הדפים; הם עוברים דרך גומיות אל התוף. 2 תוף (Drum) — גליל שמסתובב; קרן הלייזר ״מציירת״ עליו את תוכן ההדפסה, והוא מושך טונר ומצמיד אותו לדף. 3 טונר (Cartridge) — מיכל אבקה ב-4 גוונים. 4 פיוזר (Fuser) — השלב האחרון: מחמם את האבקה כדי שתידבק לדף.",["מגירת דפים ← תוף ← טונר ← פיוזר","טונר ← מגירת דפים ← פיוזר ← תוף","פיוזר ← תוף ← מגירת דפים ← טונר","תוף ← פיוזר ← טונר ← מגירת דפים"],{mq:"מהו סדר הרכיבים במדפסת לייזר לפי תהליך ההדפסה?",n:"בחוברת ארבעת גווני הטונר מופיעים כאדום, צהוב, כחול ושחור. בפועל אלה ציאן, מג׳נטה, צהוב ושחור (CMYK).",v:[["איזה רכיב במדפסת לייזר מחמם את אבקת הטונר כדי שתידבק לדף?",["פיוזר (Fuser)","תוף (Drum)","מגירת דפים (Tray)","טונר (Cartridge)"]]]}],
["m9",46,"מהן 4 דרכי ההתחברות למדפסת, וכיצד נגדיר כל אחת?","1 מקומית (Local) — מחוברת למחשב אחד ב-USB; מתקינים דרייבר משרת ההתקנות, ואז Control Panel ← View Devices and Printers ← Add a printer. 2 מקומית משותפת — ניגשים לכתובת ה-IP של המחשב שאליו מחוברת המדפסת דרך Run (Win+R); כשהמחשב המשתף כבוי אי אפשר להדפיס. 3 שרתית — הגדרה בשרת המדפסות (תיקייה רשתית שמציגה את כל המדפסות). 4 רשתית (Network Printer) — מדפסת אחת למחשבים רבים, מוגדרת עם כתובת IP קבועה.",["מקומית, מקומית משותפת, שרתית ורשתית","USB, Bluetooth, Wi-Fi ו-NFC","דיו, לייזר, מחט ותרמית","ראשית, משנית, גיבוי וחירום"],{v:[["מה החיסרון של מדפסת מקומית משותפת?",["אי אפשר להדפיס כשהמחשב המשתף כבוי","היא דורשת כתובת IP קבועה","אפשר להדפיס רק משרת","היא עובדת רק ב-USB"]]]}],
["m9",47,"מהו ה-Printer Spooler וכיצד ניכנס אליו?","תור ההדפסה — מראה מה מודפס כרגע ומתי יודפס המסמך שנשלח. נכנסים דרך Control Panel ← Hardware and Sound ← Devices and Printers, ובוחרים את המדפסת.",["תור ההדפסה — Control Panel ← Hardware and Sound ← Devices and Printers","הדרייבר של המדפסת — Device Manager","מגירת הדפים","שרת ההתקנות"]],
["m10",48,"מהי מערכת הפעלה?","תוכנה שמנהלת את משאבי החומרה והתוכנה במחשב ומספקת את התשתית להרצת יישומים; מקשרת בין המשתמש, החומרה ותוכנות המחשב. בדרך כלל עולה עם הדלקת המחשב.",["תוכנה שמנהלת את משאבי החומרה והתוכנה ומקשרת בין המשתמש לחומרה","תוכנה לעריכת מסמכים","השבב שמאחסן את הגדרות ה-BIOS","אנטי־וירוס מובנה"]],
["m10",49,"מהם קבצי DLL?","Dynamic Link Library — קבצי מערכת שתוכנות עושות בהם שימוש משותף. במקום ליצור אותם בתיקייה של כל תוכנה, יש קובץ אחד שכל התוכנות משתמשות בו.",["ספריות קוד משותפות שתוכנות רבות משתמשות בהן","קבצי גיבוי של מערכת ההפעלה","דרייברים של מדפסות בלבד","קבצי סיסמאות"]],
["m10",50,"כיצד נבצע פרמוט/התקנת מערכת הפעלה למחשב?","מתקינים לפי הרשת המבוקשת (שביל, גלקסיה וכו׳). בהתקנה מהרשת לוחצים F12 בהדלקה ובוחרים IPv4/IPv6; ההתקנה נעשית משרת WDS (Windows Deployment Services) עם Image שכולל את האפליקציות הרלוונטיות (דרייברים, Office). בסוף מתקבל ״Deployment Completed״ ומזינים משתמש (חזק).",["F12 בהדלקה, בחירת IPv4/IPv6, והתקנה משרת WDS עם Image מתאים","מורידים את Windows מהאינטרנט ומתקינים מדיסק און קי","פותחים Device Manager ובוחרים התקנה מחדש","נכנסים ל-BIOS ובוחרים Install Windows"],{v:[["מאיזה שרת מותקנת מערכת ההפעלה בהתקנה מהרשת?",["WDS — Windows Deployment Services","DHCP","DNS","ePO"]]]}],
["m10",51,"מה ה-Control Panel מאפשר לנו לעשות?","התקנה והסרה של תוכנות; התקנת רכיבים (מדפסת, מקלדת וכו׳); הגדרות מערכת; הגדרת תצוגה של חלונות וסמלים; קביעת תאריך ושעה. חלק מהפעולות דורשות הרשאות מנהל מקומי.",["התקנה והסרה של תוכנות, התקנת התקנים, הגדרות תצוגה ותאריך","רק כיבוי המחשב","ניהול טבלת ה-CAM","עריכת קוד המקור של Windows"]],
["m10",52,"מהו דרייבר?","מנהל התקן — קוד או אוסף קבצים שמאפשר למערכת ההפעלה לתקשר עם רכיב חומרה. הוא מכיר את פרטי הרכיב ואת אפשרויות הניהול שלו, ומותאם לגרסת מערכת ההפעלה ולמעבד.",["תוכנה שמאפשרת למערכת ההפעלה לתקשר עם רכיב חומרה","רכיב חומרה שמחבר דיסקים","תוכנת אנטי־וירוס","כבל שמחבר מדפסת"]],
["m10",53,"מה ניתן לעשות ב-Device Manager?","רואים בו את כל ההתקנים שהמחשב מכיר, ובלחיצה על התקן אפשר: לקרוא את פרטי הדרייבר, לעדכן אותו, להחזיר למצב קודם (Roll Back), להשבית את ההתקן ולהסיר אותו. נדרש משתמש חזק.",["לצפות בהתקנים, לעדכן או להחזיר דרייבר, להשבית ולהסיר התקן","לסיים תהליכים תקועים","לנהל משתמשים וקבוצות","לבדוק קישוריות לרשת"]],
["m10",54,"מה ניתן לראות/לעשות ב-Task Manager?","בחלון Processes — כל התהליכים: אפשר לסיים תהליכים, להפעיל תהליכים מחדש ולראות את הצריכה שלהם. בחלון Performance — ביצועי המחשב: מעבד, זיכרון RAM, דיסק ורשת.",["לסיים תהליכים ולראות ביצועי מעבד, זיכרון, דיסק ורשת","לעדכן דרייברים","לשתף תיקיות ברשת","לשנות את סדר האתחול"]],
["m10",55,"מה ניתן לעשות ב-Computer Management?","גישה לכלי ניהול: הגדרת משימות מתוזמנות; צפייה באירועים (Event Viewer) לתחקור קריסות ושגיאות; תיקיות משותפות; משתמשים וקבוצות מקומיים; ובלשונית Services and Applications — ניהול השירותים והפונקציות במחשב.",["משימות מתוזמנות, Event Viewer, תיקיות משותפות, משתמשים וקבוצות ושירותים","רק התקנת תוכנות","רק בדיקת קישוריות","שינוי הגדרות ה-BIOS"]],
["m10",56,"מהו ה-CMD, ואילו 4 פקודות עיקריות למדנו לבצע בו?","כלי לניהול המחשב בעזרת פקודות ב-Windows. 1 ping — בדיקת קישוריות: שולח 4 חבילות Echo ומצפה לקבל אותן בחזרה. 2 tracert — מציג את כתובות הציוד שעוברים בדרך ליעד. 3 ipconfig /all — מידע מפורט על המחשב ונתוני הרשת (כתובות, שרתים ועוד). 4 nslookup — מציג את כתובת ה-IP שמתאימה לשם דומיין (שאילתת DNS).",["ping, tracert, ipconfig /all ו-nslookup","show run, show vlan, show ip ו-write","copy, paste, cut ו-delete","enable, configure, hostname ו-exit"],{v:[["איזו פקודה ב-CMD מציגה את המסלול (התחנות בדרך) עד ליעד?",["tracert","ping","nslookup","ipconfig /all"]],["כמה חבילות שולחת פקודת ping כברירת מחדל ב-Windows?",["4","1","10","ללא הגבלה"]]]}],
["m10",57,"מהי תיקיית Instpoint, וכיצד ניגשים אליה?","תיקייה רשתית ברשת שביל החלב, שבה יש אפליקציות, קבצים ומסמכים להתקנה במחשב. ניגשים אליה משורת ה-Run (Win+R) ומקלידים: ⁦\\\\IAF-INSTPOINT\\SUPPORT$⁩",["תיקייה רשתית עם תוכנות להתקנה; ניגשים דרך Win+R","תיקיית קבצים זמניים במחשב","תור ההדפסה","תיקייה בדיסק C שמכילה את ה-BIOS"]]
);

B.push(
["s1",1,"מהו שרת?","מחשב שמריץ תוכנה או תוכנות ומספק שירותים למחשבים אחרים. דרישות החומרה שלו גבוהות מאלה של מחשב שולחני, ויש לו דרישות מיוחדות של זמינות, שרידות וגיבוי. שרת הוא גם תוכנה שמספקת שירותים לתוכנות לקוח (Client).",["מחשב או תוכנה שמספקים שירותים ללקוחות, עם דרישות זמינות, שרידות וגיבוי","כל מחשב עם יותר מדיסק אחד","מתג רשת מרכזי","מחשב נייד של מנהל הרשת"]],
["s1",2,"מהו RAID?","שיטה לאיחוד כמה דיסקים קשיחים ליחידה לוגית אחת: גישה מקבילית לכמה דיסקים, שיפור מהירות ואמינות. מערכת ההפעלה מתייחסת למערך כדיסק אחד. בדרך כלל כל הדיסקים מאותו סוג ונפח.",["איחוד כמה דיסקים ליחידה לוגית אחת לשיפור מהירות ואמינות","סוג של זיכרון RAM לשרתים","פרוטוקול לגיבוי ברשת","תוכנה לאיחוי הדיסק"]],
["s1",3,"פרט על RAID 0, RAID 1 ו-RAID 0+1.","RAID 0 — לפחות 2 דיסקים; המידע מחולק בחלקים קבועים בין הדיסקים לפי הסדר — מגביר מהירות (בלי גיבוי). RAID 1 — לפחות 2 דיסקים; כל המידע משוכפל לכל הדיסקים (״מערך ראי״) — גיבוי מלא ושרידות גבוהה. RAID 0+1 — לפחות 4 דיסקים; משלב חלוקה (0) ושכפול לקבוצה זהה (1).",["RAID 0 — פיזור למהירות; RAID 1 — שיקוף לגיבוי; RAID 0+1 — שילוב, לפחות 4 דיסקים","RAID 0 — שיקוף; RAID 1 — פיזור; RAID 0+1 — דיסק אחד","RAID 0 — גיבוי לענן; RAID 1 — גיבוי לקלטת; RAID 0+1 — שניהם","RAID 0 — ללא דיסקים; RAID 1 — דיסק אחד; RAID 0+1 — שני דיסקים"],{v:[["באיזה מערך RAID נפילת דיסק אחד אינה גורמת לאובדן מידע, כי המידע משוכפל?",["RAID 1","RAID 0","אף אחד מהם","RAID 0 עם דיסק אחד"]],["מהו מספר הדיסקים המינימלי ל-RAID 0+1?",["4","2","3","1"]]]}],
["s1",4,"במה נתחשב בעת תכנון פריסת שרתים?","גישה נוחה לשרת לטיפול ותחזוקה; ריכוז השרתים במקום אחד; אוורור וקירור (מרחק מספיק); סידור כבילה (מיקום נוח, אורכים מתאימים); אפשרות לחבר מקלדת ועכבר; אפשרות להתרחבות עתידית.",["גישה לתחזוקה, ריכוז, אוורור וקירור, כבילה מסודרת והתרחבות עתידית","צבע הארון והמותג","קרבה לחלון ולמזגן ביתי","מספר המשתמשים בארגון בלבד"]],
["s1",5,"פרט על 3 תצורות השרתים שנלמדו: מבנה, יתרונות וחסרונות.","TOWER — דומה למארז מחשב רגיל (לרוב גדול יותר). יתרונות: קירור קל, אין הגבלה לכמות השרתים. חסרונות: גדול, כבד, כבילה מסובכת, רועש. RACK — צורה סטנדרטית שמתאימה לארון שרתים. יתרונות: עצמאי (מכיל את כל הרכיבים), יעיל (הרבה שרתים בארון). חסרונות: צריכת חשמל גבוהה, קושי בתחזוקה. BLADE — מארז מודולרי עם ״להבים״ (שרתים) שמחוברים ללוח מרכזי, עם קירור, ספקי כוח, רשת וניהול משותפים. יתרונות: הוזלת עלויות לטווח ארוך, ניהול קל. חיסרון: יקר ברכישה ראשונית.",["Blade","Tower","Rack","Desktop"],{mq:"איזו תצורת שרתים יקרה ברכישה הראשונית אך חוסכת עלויות לטווח ארוך וקלה לניהול?",v:[["מה חיסרון של שרת Tower?",["גדול, כבד ורועש, עם כבילה מסובכת","יקר מאוד ברכישה ראשונית","מוגבל לארון שרתים אחד","אי אפשר לקרר אותו"]],["איזו תצורת שרת בנויה בצורה סטנדרטית שמתאימה לארון שרתים, ומכילה את כל רכיביה?",["Rack","Tower","Blade","Desktop"]]]}],
["s1",6,"מהו שרת NAS?","Network Attached Storage — מערכת אחסון קבצים חיצונית ברשת נתונים רגילה (TCP/IP). מאפשרת ליצור תיקיות רשתיות שאליהן פונים שרתים ומשתמשים כדי לשמור ולקרוא קבצים (בדומה ל-Google Drive). בחיל יש תיקיות כאלה בכל בסיס/גף/מדור.",["אחסון קבצים ברשת הרגילה (TCP/IP) עם תיקיות רשתיות משותפות","רשת סיבים ייעודית שבה השרת רואה דיסק מקומי","דיסק פנימי בתוך השרת","שרת לחלוקת כתובות IP"]],
["s1",7,"מהו שרת SAN?","Storage Area Network — רשת ייעודית שמחברת רכיבי אחסון וגיבוי חיצוניים לשרתים (לרוב בסיבים אופטיים). השרת מתנהל מול הנפח כמו מול דיסק מקומי. במערך המרכזי דיסקים רבים בנפחים גדולים, ונתח שמוקצה לשרת נקרא LUN.",["רשת אחסון ייעודית שבה השרת רואה את הנפח כדיסק מקומי; נתח מוקצה נקרא LUN","תיקייה רשתית משותפת דרך TCP/IP","דיסק און קי שמחובר לשרת","שרת אינטרנט"],{v:[["איך נקרא נתח דיסקים שמוקצה לשרת במערך SAN?",["LUN","OU","Scope","GPO"]]]}],
["s1",8,"כיצד נחליף דיסק בשרת?","מוציאים את הדיסק התקול (לחיצה על כפתור הנעילה ומשיכה); לוקחים דיסק חדש זהה (סוג ונפח); מכניסים במקום הישן ומוודאים נעילה מלאה; הדיסק מסתנכרן עם מערך ה-RAID ומתחיל לפעול אוטומטית. אסור לכבות את השרת בשום שלב!",["מחליפים בזמן שהשרת דולק, בדיסק זהה, והוא מסתנכרן אוטומטית עם ה-RAID","מכבים את השרת, מחליפים ומתקינים מחדש את מערכת ההפעלה","מחליפים בכל דיסק שיש, ללא קשר לנפח","מוציאים את כל הדיסקים ומכניסים אותם מחדש"]],
["s2",9,"מהו שרת SCCM? מהן יכולותיו?","System Center Configuration Manager — תוכנה של Microsoft לניהול קבוצות גדולות של מחשבים: שליטה מרחוק, ניהול עדכונים, הפצת תוכנות, התקנת מערכת הפעלה מרחוק ואבטחה. יכולות: ניהול נכסים (Asset Management), מלאי חומרה ותוכנה, הפצת תוכנה, עדכוני אבטחה, דוחות, ועזרים לפתרון תקלות מרחוק.",["ניהול מחשבים רבים: הפצת תוכנות, עדכונים, מלאי, דוחות ושליטה מרחוק","שרת לחלוקת כתובות IP","שרת דוא״ל ארגוני","שרת שמנהל טלפונים"]],
["s2",10,"מהי מכונה וירטואלית?","מחשב ״תוכנתי״ שרץ על גבי שרת פיזי — מאפשר להפעיל מערכת/תוכנה בלי צורך בחומרה פיזית נוספת, בלי להפריע לשאר מה שרץ על השרת.",["מחשב תוכנתי שרץ על שרת פיזי כאילו היה מחשב נפרד","מחשב ישן שהוצא משימוש","שרת בענן בלבד","מחשב ללא מערכת הפעלה"]],
["s2",11,"מהו HYPERVISOR? הסבר על HYPERVISOR מסוג 1 ומסוג 2.","Hypervisor — תוכנה שמריצה ומנהלת מכונות וירטואליות. Type 1 — רץ ישירות על החומרה, בלי מערכת הפעלה מתחתיו; מתאים לחוות שרתים. Type 2 — רץ בתוך מערכת הפעלה קיימת; מתאים למחשב אישי עם מעט מכונות.",["Type 1 — ישירות על החומרה (לחוות שרתים); Type 2 — בתוך מערכת הפעלה (למחשב אישי)","Type 1 — בתוך מערכת הפעלה; Type 2 — על החומרה","Type 1 — לשרתי Linux; Type 2 — לשרתי Windows","Type 1 — חינמי; Type 2 — בתשלום"],{v:[["איזה סוג Hypervisor מתאים לחוות שרתים עם הרבה תהליכים במקביל?",["Type 1 — רץ ישירות על החומרה","Type 2 — רץ על מערכת הפעלה","שניהם מתאימים באותה מידה","אף אחד מהם"]]]}],
["s2",12,"מהו CLUSTER?","אשכול: כמה שרתים (וירטואליים) שמוגדרים לעבוד יחד בתיאום כה גבוה שהם נראים כשרת אחד — לצורך שרידות. שרידות תוכנתית: אם מכונה וירטואלית נופלת, משתמשים במכונה אחרת. שרידות חומרתית: אם שרת פיזי נופל, המכונות עוברות לשרת פיזי אחר.",["אשכול שרתים שעובדים יחד כשרת אחד לצורך שרידות","מערך דיסקים","ארון שרתים","סוג של מתג"]],
["s2",13,"מהי וירטואליזציה? מהם היתרונות והחסרונות?","טכנולוגיה להרצת שרתים לוגיים (וירטואליים) רבים על שרת פיזי אחד, כשכל אחד מתנהג כמחשב נפרד. יתרונות: פחות שרתים פיזיים; חיסכון ברכישה ובחשמל; אי־תלות בין חומרה לתוכנה (אפשר להעביר מכונה בין שרתים); שרידות גבוהה. חסרונות (תוספת, לא בחוברת): כשל בשרת הפיזי משפיע על כל המכונות שעליו אם אין Cluster; המכונות מתחרות על אותם משאבים; נדרשים ידע ורישוי.",["חיסכון בשרתים פיזיים ובחשמל","כל מכונה וירטואלית צריכה שרת פיזי משלה","אי אפשר להעביר מכונה בין שרתים","היא מבטלת את הצורך בגיבוי"],{mq:"מהו יתרון של וירטואליזציה?"}],
["s3",14,"מהו קובץ? מהי מערכת קבצים?","קובץ — אוסף מידע מאוגד, שמור במקום אחסון, שמערכת ההפעלה או תוכנה יכולות לגשת אליו. מערכת קבצים — קובעת איך המידע נשמר ונשלף: נותנת שם לכל פיסת מידע ומפרידה בין הקבצים, כך שקל לעבוד עם המידע.",["קובץ — מידע מאוגד באחסון; מערכת קבצים — האופן שבו המידע נשמר, נקרא ומופרד","קובץ — תיקייה; מערכת קבצים — דיסק","קובץ — תוכנה; מערכת קבצים — מערכת הפעלה","קובץ — שורת קוד; מערכת קבצים — שרת"]],
["s3",15,"מה קורה בעת מחיקת קובץ?","הקובץ עובר לסל המחזור. אחרי ריקון הסל נמחקת רק הרשומה (המצביע) של הקובץ בטבלה — המידע עצמו (הביטים) נשאר בדיסק, ולכן אפשר לשחזר אותו.",["נמחק רק המצביע לקובץ; הביטים נשארים ואפשר לשחזר","המידע נמחק פיזית מיד","הקובץ עובר לשרת הגיבוי","הקובץ מוצפן"],{mq:"מה קורה בפועל בדיסק אחרי ריקון סל המחזור?"}],
["s3",16,"כיצד ניצור תיקייה רשתית משותפת?","הולכים לתיקייה, לוחצים מקש ימני ← Properties ← לשונית Sharing ← Advanced Sharing.",["מקש ימני על התיקייה ← Properties ← Sharing ← Advanced Sharing","Control Panel ← Devices and Printers","Task Manager ← Processes","CMD ← ping"]],
["s3",17,"כיצד נבצע שחזור תיקיות/קבצים?","נכנסים למיקום שבו הקובץ/התיקייה נשמרו, מקש ימני ← Restore Previous Versions, בוחרים את הגרסה לפי התאריך, והיא משוחזרת עם כל התוכן.",["מקש ימני במיקום ← Restore Previous Versions ← בחירת גרסה לפי תאריך","Device Manager ← Roll Back","פרמוט הדיסק והתקנה מחדש","CMD ← nslookup"]],
["s3",18,"הסבר על מערכות הקבצים FAT ו-NTFS.","שתיהן טבלאות שמסמנות את המיקום הפיזי של הקבצים בדיסק ומחזיקות מצביעים. FAT — ישנה, מוגבלת בנפח, בלי הרשאות. NTFS — חדשה ומתקדמת; נוספו בה הרשאות (מי יכול לגשת ומה לעשות) ובעלות; בשימוש ברוב המחשבים.",["NTFS תומכת בהרשאות; FAT ישנה ומוגבלת, בלי הרשאות","FAT תומכת בהרשאות; NTFS לא","שתיהן זהות","NTFS מיועדת לדיסק און קי בלבד"],{mq:"מה ההבדל המרכזי בין NTFS ל-FAT?"}],
["s3",19,"אילו סוגי הרשאות לקובץ/תיקייה קיימים, ומה כל אחד מאפשר?","List Folder Contents — צפייה ברשימת הקבצים והתיקיות (לתיקייה). Read — קריאת תוכן ומאפיינים. Read & Execute — קריאה + הרצת קבצי הרצה. Write — יצירת קבצים ותיקיות ושינוי מאפיינים (בקובץ: כתיבה על קובץ קיים). Modify — כל הקודמות + מחיקה. Full Control — הכל + שינוי הרשאות ולקיחת בעלות.",["Full Control","Modify","Write","Read & Execute"],{mq:"איזו הרשאה מאפשרת גם לשנות את ההרשאות של אחרים ולקחת בעלות?",v:[["איזו הרשאה כוללת קריאה, הרצה, כתיבה ומחיקה — אך לא שינוי הרשאות?",["Modify","Full Control","Read & Execute","List Folder Contents"]]]}],
["s3",20,"מהם 4 המצבים לכל הרשאה (מהשאלה הקודמת)?","Allow — מתן ההרשאה. Deny — חסימה ללא יוצא מן הכלל, גם אם יש הרשאה מקבוצה אחרת. Copy — העתקת הרשאות של משתמש קיים למשתמש חדש. Default — אם לא הוגדר דבר, אין הרשאה, אלא אם התקבלה מקבוצה שהמשתמש שייך אליה.",["Deny גובר וחוסם את הגישה","Allow גובר כי הוא ניתן קודם","ההרשאה הגבוהה מבין השתיים קובעת","המשתמש מקבל הודעה ובוחר"],{mq:"למשתמש יש Allow מקבוצה אחת ו-Deny מקבוצה אחרת על אותה תיקייה. מה יקרה?",n:"ארבעת המצבים כאן הם כפי שמופיעים בחוברת. בממשק של Windows מופיעים בפועל רק Allow ו-Deny, וחוקי הירושה (Inheritance)."}],
["s3",21,"כיצד נצפה בהרשאות על תיקייה/קובץ מסוים?","Properties ← לשונית Security: רואים את ההרשאות של כל קבוצה/משתמש. בעזרת משתמש חזק אפשר לשנות אותן שם.",["Properties ← Security","Properties ← Sharing ← Advanced Sharing","Task Manager ← Users","Device Manager ← Properties"]],
["s3",22,"מהי דיפרגמנטציה, וכיצד נבצע אותה?","איחוי: ארגון המידע בדיסק ברצף. עבודה עם הדיסק (שמירה, מחיקה, עריכה) יוצרת ״חורים״ ופיצול, שמאטים את התוכנות. ביצוע: מקש ימני על הדיסק ← Properties ← Tools ← Optimize/Defragment. לא מבצעים דיפרגמנטציה על SSD.",["סידור קבצים מפוצלים ברצף; Properties ← Tools; לא על SSD","מחיקת קבצים כפולים; רק על SSD","הצפנת הדיסק; דרך BIOS","חלוקת הדיסק למחיצות; דרך CMD"],{v:[["על איזה סוג כונן לא מבצעים דיפרגמנטציה?",["SSD","HDD","דיסק חיצוני מכני","מערך RAID של דיסקים מכניים"]]]}],
["s3",23,"מהי DISK QUOTA, וכיצד נבצע אותה?","הקצאה והגבלה של מקום בדיסק לכל משתמש — כדי להתאים את המקום לפי המשתמשים ולמנוע שימוש ללא הגבלה. ביצוע: Properties של הדיסק ← לשונית Quota.",["הגבלת נפח הדיסק לכל משתמש; Properties ← Quota","גיבוי הדיסק לענן","בדיקת שגיאות בדיסק","מחיקת קבצים זמניים"]],
["s4",24,"מהו שרת WEB?","שרת שמציג דפי HTML (עיצוב דפי אינטרנט), תמונות וקבצים באינטרנט; מאפשר לאפליקציות לפעול בפורטים שלהן ואחראי על אופן העברת המידע (TCP/UDP). יכול גם להצפין את הדף ב-HTTPS.",["שרת שמגיש דפי אינטרנט, תמונות וקבצים לדפדפנים","שרת שמחלק כתובות IP","שרת לניהול משתמשים","שרת שמנהל טלפונים"]],
["s4",25,"מהי תוכנת IIS?","Internet Information Services — תוכנת שרת WEB של Microsoft, פועלת בעיקר ב-Windows ועונה לבקשות מהדפדפן.",["שרת ה-WEB של Microsoft ל-Windows","אנטי־וירוס","מערכת קבצים","שרת DHCP של Cisco"]],
["s5",26,"מהו DOMAIN?","יחידת ניהול ארגונית לניהול רשת המחשבים והמשתמשים. בנוסף, דומיין יכול להיות שם ייחודי של אתר באינטרנט או כתובת דוא״ל.",["יחידת ניהול ארגונית של מחשבים ומשתמשים (וגם שם אתר)","סוג של כבל רשת","תיקייה משותפת","שרת גיבוי"]],
["s5",27,"מהו SUB-DOMAIN?","דומיין תחת דומיין ראשי — יחידה ארגונית בתוך אותו דומיין.",["דומיין שנמצא תחת דומיין ראשי","דומיין שאינו מחובר לאינטרנט","דומיין זמני לבדיקות","שם אחר ל-OU"]],
["s5",28,"מהו שרת ה-DC (DOMAIN CONTROLLER)?","שרת שמאחסן את כל מסד הנתונים של הדומיין ומספק שירות אימות: כל הזדהות לדומיין נבדקת מולו. ככל שיש יותר DC — האימות מהיר יותר. ה-DC יכולים להיות זהים (לשרידות) או לחלק ביניהם תפקידים (לחלוקת עומס).",["שרת שמחזיק את מסד הנתונים של הדומיין ומאמת משתמשים","שרת שמחלק כתובות IP","שרת אינטרנט","מתג ליבה"]],
["s5",29,"מהו DOMAIN NAMESPACE?","שיטה למתן שמות שמספקת את המבנה ההיררכי של נתוני ה-DNS. כל נקודה (.) מייצגת הפרדה בין רמות; הצמתים נקראים Domain.",["המבנה ההיררכי של שמות ב-DNS, שבו נקודה מפרידה בין רמות","רשימת המשתמשים בדומיין","כתובת ה-IP של ה-DC","שם המחשב ברשת"]],
["s5",30,"מהו ROOT DOMAIN?","הדומיין שבראש המבנה ההיררכי, מיוצג על ידי נקודה (.), ומנוהל ע״י כמה ארגונים עולמיים.",["ראש ההיררכיה, מיוצג בנקודה (.) ומנוהל ע״י ארגונים עולמיים","הדומיין הראשון שנוצר בארגון","הדומיין של מנהל הרשת","דומיין עם הרשאות Full Control"]],
["s5",31,"מהי מערכת ה-Active Directory?","כלי שמספק ניהול, סדר וארגון לדומיין: קטלוג מרכזי שבו נשמרים כל האובייקטים בדומיין, שמקל על חיפוש ומאפשר לנהל את כל הרשת ממקום אחד. המבנה היררכי.",["קטלוג מרכזי של אובייקטי הדומיין לניהול הרשת ממקום אחד","מערכת קבצים של Windows","תוכנת אנטי־וירוס","שרת להתקנת מערכות הפעלה"]],
["s5",32,"מהו Organization Unit ב-AD?","יחידה ארגונית: ה-AD מורכב מ-OU שונות, וכל אחת מכילה אובייקטים — לסדר וארגון. ההרשאות והמדיניות ניתנות ל-OU ולא לכל אובייקט בנפרד.",["יחידה ארגונית ב-AD שמכילה אובייקטים ומקבלת הרשאות ומדיניות כקבוצה","שרת ראשי בדומיין","סוג של הרשאה","תיקייה רשתית"]],
["s5",33,"מהו עץ? מהו יער?","עץ — אוסף דומיינים שחולקים מרחב שמות (namespace) משותף. הדומיין הראשון הוא ״דומיין האב״ (root/parent), ודומיין שנוסף הוא child/sub domain, ושמו ממשיך את שם האב. יער — המבנה הגבוה ביותר שמאגד את כל העצים והדומיינים של הארגון.",["עץ — דומיינים עם מרחב שמות משותף; יער — המבנה העליון שמאגד עצים","עץ — רשימת תיקיות; יער — רשימת דיסקים","עץ — OU אחת; יער — כמה OU","עץ ויער הם שמות לאותו דבר"],{n:"בחוברת היער מוגדר כ״העץ הגבוה ביותר״. מדויק יותר: יער הוא אוסף של עץ אחד או יותר, שחולקים סכמה וקטלוג משותפים."}],
["s5",34,"מהו GPO (Group Policy Object)?","מנגנון לניהול מרוכז של מדיניות הרשאות ברשת: קובע הגבלות ואפשרויות שימוש במחשב (למשל מניעת שינוי השעון או הגדרות). במקום להגדיר לכל מחשב, מגדירים מדיניות לכל OU.",["ניהול מרוכז של מדיניות והגבלות למחשבים ומשתמשים לפי OU","גיבוי של מסד נתוני הדומיין","פרוטוקול להצפנת סיסמאות","שרת שמחלק כתובות"],{v:[["רוצים למנוע מכל המשתמשים ב-OU מסוים לשנות את שעון המחשב. באיזה כלי נשתמש?",["GPO","DHCP Scope","Disk Quota","Task Manager"]]]}],
["s5",35,"מהו שרת ה-DNS?","Domain Name System — שרת שממיר שמות דומיין לכתובות IP ולהפך, כי ציודי הרשת לא מכירים שמות אתרים.",["שרת שממיר שמות דומיין לכתובות IP ולהפך","שרת שמחלק כתובות IP","שרת שמאמת משתמשים","שרת שמגיש דפי אינטרנט"]],
["s5",36,"מהו TLD (Top Level Domain)? מהו SLD (Second Level Domain)?","TLD — סיומת האינטרנט העליונה (למשל ‎.com, ‎.il, ‎.org), מחולקת לפי סוג הארגון או מיקום גיאוגרפי. SLD — הסיומת המשנית, בדרך כלל שם הארגון שעל שמו רשום התחום.",["TLD — הסיומת העליונה (‎.com, ‎.il); SLD — הרמה שמתחתיה, שם הארגון","TLD — שם הארגון; SLD — הסיומת","TLD — דומיין פנימי; SLD — דומיין חיצוני","TLD — שרת DHCP; SLD — שרת DNS"],{v:[["בכתובת google.com, מהו ה-TLD?",["com","google","google.com","www"]]]}],
["s6",37,"מהו שרת DHCP?","שרת שאחראי על חלוקה דינמית של כתובות IP ברשת. בדרך כלל מספק גם Subnet Mask, Default Gateway וכתובת שרת DNS — כל מה שהמחשב צריך כדי לתפקד ברשת.",["שרת שמחלק כתובות IP ופרטי רשת (מסיכה, שער, DNS)","שרת שממיר שמות לכתובות","שרת שמאמת משתמשים","שרת שמגיש דפי אינטרנט"]],

  const q=QI[it.id];
  const prompt=GRADE_RULES+`
החזר JSON בלבד בפורמט: {"score":0,"verdict":"נכון|חלקי|שגוי","feedback":"","missing":[]}

שאלה: ${q.q}
תשובת המפתח: ${q.a}${q.note?"\nהערת דיוק: "+q.note:""}${q.cli?"\n(שאלת פקודות CLI)":""}
תשובת החניך: ${it.a}`;
  const r=await sample.json(prompt,{modelTier:"quick"});
  return normGrade(r);
}
function normGrade(r){
  let sc=Number(r&&r.score);if(!isFinite(sc))throw {code:"bad_json"};sc=Math.max(0,Math.min(100,sc));
  return {sc:sc/100,fb:String(r.feedback||""),miss:Array.isArray(r.missing)?r.missing.slice(0,3).map(String):[],by:"ai"};
}
async function aiGradeBatch(items,onProg){
  for(let i=0;i<items.length;i+=6){
    const chunk=items.slice(i,i+6);
    const body=chunk.map((it,k)=>{const q=QI[it.id];return `### פריט ${k+1}${q.cli?" (שאלת פקודות CLI)":""}
שאלה: ${q.q}
תשובת המפתח: ${q.a}${q.note?"\nהערת דיוק: "+q.note:""}
תשובת החניך: ${it.a}`;}).join("\n\n");
    const prompt=GRADE_RULES+`
בדוק כל פריט בנפרד. החזר JSON בלבד בפורמט: {"results":[{"item":1,"score":0,"verdict":"","feedback":"","missing":[]}]}

`+body;
    const r=await sample.json(prompt,{modelTier:"quick"});
    const arr=(r&&r.results)||[];
    chunk.forEach((it,k)=>{const g=arr.find(x=>Number(x.item)===k+1)||arr[k];if(g){try{it.r=normGrade(g);}catch(e){}}});
    onProg(Math.min(items.length,i+chunk.length),items.length);
  }
}

/* ---------- exam building ---------- */
function itemW(q){const s=S.st[q.id];if(!s)return 1.6;return (s.l==="bad"?2.4:s.l==="part"?1.7:0.5)/(1+0.25*s.s);}
function subErr(sub){let s=0,c=0;BY_SUB[sub].forEach(q=>{const t=S.st[q.id];if(t){s+=t.s;c+=t.c;}});return s?1-c/s:0.5;}
function pick(kind,sub){
  let chosen=[];
  if(kind==="exam"){
    const set=new Set();
    SUBS.forEach(su=>set.add(wpick(BY_SUB[su],itemW)));
    let guard=0;
    while(set.size<EXAM_N&&guard++<500){const su=wpick(SUBS,x=>BY_SUB[x].length);const pool=BY_SUB[su].filter(q=>!set.has(q));if(pool.length)set.add(wpick(pool,itemW));}
    chosen=[...set];
  }else if(kind==="boost"){
    const errs={};SUBS.forEach(su=>errs[su]=subErr(su));
    let pool=Q.slice();
    const w=q=>{const s=S.st[q.id];const base=!s?1.2:s.l==="bad"?5:s.l==="part"?3.5:0.35;return base*(0.6+errs[q.sub]*1.4);};
    while(chosen.length<EXAM_N&&pool.length){const q=wpick(pool,w);chosen.push(q);pool=pool.filter(x=>x!==q);}
  }else{
    chosen=shuffle(BY_SUB[sub]).slice(0,12);
  }
  return chosen.sort((a,b)=>CH_ORDER.indexOf(a.ch)-CH_ORDER.indexOf(b.ch)||a.n-b.n);
}
function startExam(kind,sub){
  const qs=pick(kind,sub);
  const mix=S.set.mix;
  let fmts=qs.map(()=>mix==="open"?"open":"mc");
  if(mix==="mixed"){const k=Math.round(qs.length*OPEN_SHARE);shuffle(qs.map((_,i)=>i)).slice(0,k).forEach(i=>fmts[i]="open");}
  const items=qs.map((q,i)=>({id:q.id,f:fmts[i],vi:fmts[i]==="mc"?Math.floor(Math.random()*(q.v.length+1))-1:-1,ord:shuffle([0,1,2,3]),a:null,r:null}));
  S.cur={no:kind==="practice"?null:S.no++,kind,sub:sub||null,fb:kind==="practice"?"now":S.set.fb,mix,start:Date.now(),idx:0,items};
  save();view="exam";portsOpen=window.innerWidth>=640;render();window.scrollTo(0,0);
}

/* ---------- stats ---------- */
function countItem(it){
  if(!it.r||it.counted)return;
  const s=S.st[it.id]||{s:0,c:0,l:null};
  s.s++;const L=lvl(it.r.sc);if(L==="ok")s.c++;s.l=L;S.st[it.id]=s;it.counted=true;
}
function examScore(E){const n=E.items.length;let sum=0,pend=0;E.items.forEach(it=>{if(it.r)sum+=it.r.sc;else pend++;});return {score:Math.round(sum/n*1000)/10,pend};}

function freeCtx(text){
  const STOP=new Set(["מה","של","את","על","זה","זו","איך","למה","מהו","מהי","מהם","מהן","הוא","היא","בין","או","עם","לי","אני","יש","אם","כל","גם","רק","מתי","איפה","שלי","הסבר","תסביר","לגבי","כמו","אבל","כן","לא","the","and","what"]);
  const src=(text+" "+T.turns.filter(t=>t.role==="user").slice(-3).map(t=>t.content).join(" ")).toLowerCase();
  const words=[...new Set(src.split(/[^\p{L}\p{N}]+/u).map(w=>w.replace(/^[והבלמש](?=[\u0590-\u05FF]{3,})/,"")).filter(w=>w.length>1&&!STOP.has(w)))];
  const hits=Q.map(q=>{const hay=(q.q+" "+q.a+" "+SUB[q.sub]).toLowerCase();let s=0;words.forEach(w=>{if(hay.includes(w))s+=w.length>3?2:1;});return [s,q];}).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,14).map(x=>x[1]);
  const topics=SUBS.map(k=>CH[k[0]]+" / "+SUB[k]).join("; ");
  return `שאלה כללית של החניך. נושאי החוברת: ${topics}.\nקטעים רלוונטיים מהחוברת (שאלה ותשובת מפתח):\n\n`+(hits.length?hits.map(q=>`[${CH[q.ch]} ${q.n}] ${q.q}\nתשובה: ${q.a}${q.note?"\nהערת דיוק: "+q.note:""}`).join("\n\n"):"(לא נמצאו קטעים תואמים בחוברת — אפשר לענות מידע כללי, ולציין שהנושא לא מופיע בחוברת.)");
}

const TUTOR_RULES=`אתה מורה פרטי סבלני לחניך בקורס טכנאי רשת. הקורס מבוסס על ״חוברת שאלות לתרגול — טכנאי רשת״ (תקשורת, Packet Tracer, תקשורת IT וטלפוניה, מחשוב, שרתים).
הנחיות:
- ענה בעברית פשוטה וברורה, בקצרה (עד כ-120 מילים) אלא אם החניך ביקש להרחיב.
- הסבר את ה״למה״, תן דוגמה או אנלוגיה מוחשית, ובסוף, כשזה מתאים, שאל שאלה קצרה לבדיקת הבנה.
- מונחים טכניים כתוב באנגלית כפי שהם (VLAN, STP, DHCP). פקודות CLI כתוב כל אחת בשורה נפרדת.
- בפרטים ארגוניים או צבאיים (מגזרים, מספרי VLAN בחיל, שרתים ומיקומם, נהלים, תוכנות פנימיות) הסתמך רק על החוברת; אם המידע לא שם — אמור שאינך יודע ושכדאי לשאול את המדריך.
- כשהחוברת אינה מדויקת טכנית, אמור מה כתוב בחוברת ומה נכון בפועל, והמלץ לזכור את שניהם.
- כשהחניך מבקש ״לבחון אותו״, שאל שאלה אחת בכל פעם וחכה לתשובה.
- עיצוב: בלי כותרות. מותר **הדגשה** ורשימות עם מקף.
- פנה בגוף שני ובצורה ניטרלית מגדרית ככל האפשר.`;

function qContext(q,it){

  if(it){
    if(it.f==="mc"){const mc=mcOf(it);c+=`\nהשאלה כפי שהוצגה (אמריקאית): ${mc.text}\nהתשובה הנכונה: ${mc.opts[0]}\nהחניך בחר: ${it.a==null?"לא בחר":mc.opts[it.ord[it.a]]}`;}
    else c+=`\nתשובת החניך: ${it.a||"(ריקה)"}`;
    if(it.r)c+=`\nתוצאה: ${LVL_TXT[lvl(it.r.sc)]}${it.r.fb?" — "+it.r.fb:""}`;
  }
  return c;
}
function openTutor(key,title,ctx,chips){
  if(T.key!==key){if(T.ctl)T.ctl.abort();T={key,title,ctx,turns:[],busy:false,ctl:null,chips};}
  $("#drawer").classList.add("show");$("#scrim").classList.add("show");renderTutor();
  setTimeout(()=>$("#tin").focus(),50);
}
function closeTutor(){$("#drawer").classList.remove("show");if(!$("#modal").classList.contains("show"))$("#scrim").classList.remove("show");}
function renderTutor(){
  $("#dsub").textContent=T.title;
  const m=$("#msgs");
  m.innerHTML=T.turns.length?T.turns.map(t=>`<div class="msg ${t.role==="user"?"u":"a"}${t.err?" err":""}">${t.role==="user"?esc(t.content).replace(/\n/g,"<br>"):(t.content?md(t.content):(t.err?"":'<span class="spin"></span>חושב…'))}${t.err?`<p class="small">${esc(t.err)}</p>`:""}</div>`).join(""):`<p class="muted small">אפשר לשאול כל דבר על ${esc(T.title||"החומר")}. המורה רואה את השאלה ואת תשובת המפתח.</p>`;
  m.scrollTop=m.scrollHeight;
  $("#tchips").innerHTML=T.busy?`<button class="chip" data-act="tstop">עצירה</button>`:T.chips.map(c=>`<button class="chip" data-act="tchip">${esc(c)}</button>`).join("");
  $("#tsend").disabled=T.busy;
}
async function sendTutor(text){
  text=(text||"").trim();if(!text||T.busy||!aiOn())return;
  const user={role:"user",content:text};const asst={role:"assistant",content:""};
  T.turns.push(user,asst);T.busy=true;renderTutor();
  if(T.key==="free")T.ctx=freeCtx(text);
  const hist=T.turns.slice(0,-1).filter(t=>!t.err||t.content);
  const input=[{role:"user",content:TUTOR_RULES+"\n\n"+T.ctx},{role:"assistant",content:"הבנתי. אני כאן כדי לעזור."},...hist.map(t=>({role:t.role,content:t.content}))];
  const ctl=new AbortController();T.ctl=ctl;const myKey=T.key;
  try{
    const r=await sample(input,{cache:false,signal:ctl.signal,modelTier:"quick",onText:({text})=>{asst.content=text;const el=$("#msgs").lastElementChild;if(el&&T.key===myKey){el.innerHTML=md(text);$("#msgs").scrollTop=1e9;}}});
    asst.content=r.text;
  }catch(e){
    asst.content=e&&e.text||"";const msg=aiErr(e);
    if(!asst.content){T.turns.splice(T.turns.indexOf(user),2);$("#tin").value=text;if(msg)toast(msg);}
    else if(msg)asst.err=msg;
  }
  if(T.key===myKey){T.busy=false;T.ctl=null;renderTutor();}
}
$("#tform").addEventListener("submit",e=>{e.preventDefault();const v=$("#tin").value;$("#tin").value="";sendTutor(v);});
$("#tin").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#tform").requestSubmit();}});
const Q_CHIPS=["הסבר לי את התשובה במילים פשוטות","תן דוגמה מהשטח","למה התשובה שלי לא מספיקה?","בחן אותי בשאלה דומה"];

/* ---------- analysis & similar ---------- */
async function analyze(){
  const E=S.hist[resIdx];const box=$("#anal");if(!E||!box||!aiOn())return;
  const bySub={};E.items.forEach(it=>{const q=QI[it.id];const b=bySub[q.sub]=bySub[q.sub]||{n:0,s:0};b.n++;if(it.r)b.s+=it.r.sc;});
  const lines=Object.keys(bySub).map(su=>`${CH[su[0]]} / ${SUB[su]}: ${Math.round(bySub[su].s/bySub[su].n*100)}%`).join("\n");
  const wrong=E.items.filter(it=>it.r&&lvl(it.r.sc)!=="ok").slice(0,14).map(it=>{const q=QI[it.id];const ans=it.f==="mc"?(it.a==null?"לא ענה":mcOf(it).opts[it.ord[it.a]]):(it.a||"ריקה");return `- [${CH[q.ch]} ${q.n}] ${qTextOf(it)}\n  החניך: ${String(ans).slice(0,300)}\n  המפתח: ${q.a.slice(0,300)}`;}).join("\n");
  const hist=S.hist.filter(h=>h.kind!=="practice").slice(0,6).map(h=>examScore(h).score).reverse().join(", ");
  const prompt=`${TUTOR_RULES}

נתח את תוצאות המבחן של החניך וכתוב תוכנית חזרה קצרה (עד 200 מילים):
1. משפט פתיחה על המצב הכללי.
2. 3 נושאים לחיזוק — לכל אחד: מה כנראה לא ברור (לפי הטעויות) ומה לחזור עליו בחוברת (פרק ומספרי שאלות).
3. המלצה לצעד הבא במערכת: ״מבחן חיזוק״, ״תרגול נושא״ מסוים מהמאגר, או ״מבחן חדש״.

ציון: ${examScore(E).score}/100. ציונים במבחנים האחרונים (מהישן לחדש): ${hist}
ביצועים לפי נושא:
${lines}
שאלות שנענו לא נכון או חלקית:
${wrong||"אין"}`;
  aiStream("an-"+E.start,"anal","המורה הדיגיטלי מנתח את המבחן… (עד דקה)",prompt);
}
async function similar(i){
  const E=S.hist[resIdx];const it=E.items[i];const q=QI[it.id];
  mini[i]={busy:true};render();
  const prompt=`צור שאלה אמריקאית חדשה אחת לתרגול, על אותו נושא כמו השאלה הבאה מקורס טכנאי רשת, אבל בדגש אחר או מזווית אחרת. הסתמך רק על המידע בתשובת המפתח${q.note?" ובהערת הדיוק":""} — אל תמציא פרטים ארגוניים או צבאיים.
4 אפשרויות, בדיוק אחת נכונה, המסיחים סבירים. בעברית; מונחים טכניים באנגלית.
החזר JSON בלבד: {"q":"","options":["","","",""],"correct":0,"explain":"הסבר קצר למה התשובה נכונה"}

שאלה: ${q.q}
תשובת המפתח: ${q.a}${q.note?"\nהערת דיוק: "+q.note:""}`;
  try{
    const r=await sample.json(prompt,{modelTier:"quick",cache:false});
    if(!r||!r.q||!Array.isArray(r.options)||r.options.length!==4||!(r.correct>=0&&r.correct<4))throw {code:"bad_json"};
    mini[i]={q:String(r.q),opts:r.options.map(String),correct:Number(r.correct),explain:String(r.explain||""),pick:null};
  }catch(e){mini[i]={err:aiErr(e)||"לא הצלחתי ליצור שאלה דומה. נסו שוב."};}
  if(view==="results")render();
}

/* ---------- modal ---------- */
function modal(title,body,btns){
  $("#mt").textContent=title;$("#mb").textContent=body;const f=$("#mf");f.innerHTML="";
  btns.forEach(([t,cls,fn])=>{const b=document.createElement("button");b.className="btn "+(cls||"");b.textContent=t;b.onclick=()=>{closeModal();if(fn)fn();};f.appendChild(b);});
  $("#modal").classList.add("show");$("#scrim").classList.add("show");setTimeout(()=>f.lastChild&&f.lastChild.focus(),30);
}
function closeModal(){$("#modal").classList.remove("show");if(!$("#drawer").classList.contains("show"))$("#scrim").classList.remove("show");}
$("#scrim").addEventListener("click",()=>{closeModal();closeTutor();});

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act;
  switch(a){
    case "set":S.set[b.dataset.k]=b.dataset.v;save();render();break;
    case "new":
      if(S.cur){modal("יש מבחן בתהליך","התחלת מבחן חדש תמחק את המבחן שלא הסתיים.",[["ביטול","",null],["מחיקה והתחלה","primary",()=>{S.cur=null;startExam(b.dataset.kind);}]]);}
      else startExam(b.dataset.kind);break;
    case "practice":
      if(S.cur){modal("יש מבחן בתהליך","פתיחת תרגול תמחק את המבחן שלא הסתיים.",[["ביטול","",null],["מחיקה ותרגול","primary",()=>{S.cur=null;startExam("practice",b.dataset.sub);}]]);}
      else startExam("practice",b.dataset.sub);break;
    case "resume":view="exam";portsOpen=window.innerWidth>=640;render();break;
    case "discard":modal("למחוק את המבחן?","התשובות במבחן הזה לא יישמרו.",[["ביטול","",null],["מחיקה","primary",()=>{S.cur=null;save();render();}]]);break;
    case "home":syncAns();save();view="home";render();window.scrollTo(0,0);break;
    case "go":view=b.dataset.v;render();window.scrollTo(0,0);break;
    case "opt":{const it=curItem();if(S.cur.fb==="now"&&it.r)return;it.a=Number(b.dataset.i);save();render();break;}
    case "check":checkItem();break;
    case "next":syncAns();if(S.cur.fb==="now"){const it=curItem();if(!it.r&&!it.self&&it.a!=null&&it.a!==""){checkItem();return;}}goQ(S.cur.idx+1);break;
    case "skip":goQ(S.cur.idx+1);break;
    case "prev":goQ(S.cur.idx-1);break;
    case "goq":goQ(Number(b.dataset.i));break;
    case "ports":portsOpen=!portsOpen;render();break;
    case "finish":askFinish();break;
    case "self":{const it=curItem();const v=Number(b.dataset.v);it.r={sc:v,by:"self"};it.self=false;save();render();break;}
    case "rself":{const E=S.hist[resIdx];const it=E.items[Number(b.dataset.i)];it.r={sc:Number(b.dataset.v),by:"self"};it.self=false;countItem(it);E.dirty=true;save();render();pushReport();break;}
    case "rf":resFilter=b.dataset.v;render();break;
    case "bars":allBars=!allBars;render();break;
    case "rv":{const i=Number(b.dataset.i);openRv.has(i)?openRv.delete(i):openRv.add(i);render();break;}
    case "rvall":{const E=S.hist[resIdx];openRv=openRv.size?new Set():new Set(E.items.map((_,i)=>i));render();break;}
    case "openres":resIdx=Number(b.dataset.i);resFilter="all";openRv=new Set();mini={};view="results";render();window.scrollTo(0,0);break;
    case "analyze":analyze();break;
    case "similar":similar(Number(b.dataset.i));break;
    case "mpick":{const m=mini[Number(b.dataset.i)];if(m&&m.pick==null){m.pick=Number(b.dataset.k);render();}break;}
    case "bch":bankCh=b.dataset.v;bankQ="";render();break;
    case "bq":{const id=b.dataset.id;openBank.has(id)?openBank.delete(id):openBank.add(id);render();break;}
    case "ledgo":{const q=QI[b.dataset.id];bankCh=q.ch;bankQ="";openBank.add(q.id);view="bank";render();const el=document.getElementById("bq-"+q.id);if(el)el.scrollIntoView({block:"center"});break;}
    case "reset":modal("למחוק את כל ההתקדמות?","ההיסטוריה, הסטטיסטיקה ומבחן בתהליך יימחקו מהדפדפן הזה.",[["ביטול","",null],["מחיקה","primary",()=>{const keep={set:S.set,name:S.name,api:S.api,code:S.code};S=Object.assign(def(),keep);S.dirty=true;save();view="home";render();pushReport();}]]);break;
    case "tutor-free":if(aiOn())openTutor("free","כל החומר בחוברת",freeCtx(""),["סכם לי את נושא VLAN","מה ההבדל בין TCP ל-UDP?","בחן אותי על STP","איך זוכרים את שכבות ה-OSI?"]);break;
    case "tutor-q":{const it=curItem();const q=QI[it.id];openTutor("ex-"+S.cur.start+"-"+S.cur.idx,`${CH[q.ch]}, שאלה ${q.n}`,qContext(q,it),Q_CHIPS);break;}
    case "tutor-rv":{const E=S.hist[resIdx];const it=E.items[Number(b.dataset.i)];const q=QI[it.id];openTutor("rv-"+E.start+"-"+b.dataset.i,`${CH[q.ch]}, שאלה ${q.n}`,qContext(q,it),Q_CHIPS);break;}
    case "tutor-bank":{const q=QI[b.dataset.id];openTutor("bank-"+q.id,`${CH[q.ch]}, שאלה ${q.n}`,qContext(q,null),["הסבר לי את התשובה במילים פשוטות","תן דוגמה מהשטח","איך לזכור את זה?","בחן אותי בשאלה דומה"]);break;}
    case "tclose":closeTutor();break;
    case "connect":{const n=$("#sname"),c=$("#scode");const nn=n?n.value.trim().slice(0,80):S.name;if(nn!==S.name){S.name=nn;S.hist.forEach(h=>h.dirty=true);}if(c&&c.value.trim())S.code=c.value.trim();save();if(sync.state==="ready"){pushReport();toast("השם נשמר");render();}else connect();break;}
    case "tchip":sendTutor(b.textContent);break;
    case "tstop":if(T.ctl)T.ctl.abort();break;
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="ans"&&S.cur){const it=curItem();if(it.f==="open"&&!it.r&&!it.self){it.a=e.target.value;saveSoon();}}
  if(e.target.id==="bsearch"){bankQ=e.target.value;const pos=e.target.selectionStart;render();const s=$("#bsearch");if(s){s.focus();try{s.setSelectionRange(pos,pos);}catch(_){}}}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeModal();closeTutor();return;}
  if(view!=="exam"||!S.cur)return;
  if(e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT")return;
  if($("#modal").classList.contains("show")||$("#drawer").classList.contains("show"))return;
  const it=curItem();
  if(it.f==="mc"&&/^[1-4]$/.test(e.key)&&!(S.cur.fb==="now"&&it.r)){it.a=Number(e.key)-1;save();render();}
  else if(e.key==="Enter"){const p=document.querySelector(".actions .btn.primary");if(p)p.click();}
});
setInterval(()=>{if(view==="exam"&&S.cur){const t=$("#timer");if(t)t.textContent=fmtTime(Date.now()-S.cur.start);}},1000);
window.addEventListener("pagehide",()=>{syncAns();save();});
render();
connect();
</script>
</body>
</html>
